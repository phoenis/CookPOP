arrosto di maiale al latte": {"porzioni": "4 porzioni", "tempo": "1 ora e 30 minuti", "ingredienti": [{"ingrediente": "Arista o lonza di maiale", "qta": "800 g"}, {"ingrediente": "Latte", "qta": "500 ml"}, {"ingrediente": "Cipolla", "qta": "1"}, {"ingrediente": "Rosmarino e salvia", "qta": "q.b."}, {"ingrediente": "Vino bianco", "qta": "mezzo bicchiere"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Lega la carne con spago da cucina se necessario.", "Scalda l'olio in una casseruola e rosola la carne su tutti i lati.", "Aggiungi la cipolla tritata, rosmarino e salvia.", "Sfuma con il vino, lascia evaporare.", "Versa il latte, copri e cuoci a fuoco basso circa 1 ora, girando la carne ogni tanto.", "Togli la carne, affettala e frulla il fondo di cottura per ottenere una salsa cremosa.", "Servi le fette con la salsa."], "avanzi": "Ottima anche il giorno dopo.", "freezer": "Si può congelare.", "ricordare": "", "link": "https://www.cookist.it/arista-di-maiale-al-latte-ricetta/"}, "Brasato al vino rosso": {"porzioni": "4 porzioni", "tempo": "4 ore (+ marinatura una notte)", "ingredienti": [{"ingrediente": "Manzo per brasato (muscolo o cappello del prete)", "qta": "800 g"}, {"ingrediente": "Vino rosso corposo", "qta": "circa 750 ml"}, {"ingrediente": "Carota, sedano, cipolla", "qta": "1 pezzo ciascuno"}, {"ingrediente": "Alloro", "qta": "1-2 foglie"}, {"ingrediente": "Chiodi di garofano", "qta": "2"}, {"ingrediente": "Farina", "qta": "per infarinare"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Metti la carne in una ciotola con carota, sedano, cipolla a pezzi, alloro e pepe in grani.", "Copri con il vino e lascia marinare in frigo per una notte.", "Scola la carne (tieni da parte marinata e verdure), asciugala e infarinala leggermente.", "Rosola la carne in olio caldo su tutti i lati.", "Aggiungi le verdure della marinata e fai insaporire.", "Versa il vino della marinata filtrato, aggiungi chiodi di garofano.", "Copri e cuoci a fuoco basso per circa 3 ore, finché la carne è tenera.", "Affetta la carne e frulla il fondo di cottura per la salsa."], "avanzi": "Ottimo anche il giorno dopo, il sapore migliora riposando.", "freezer": "Si può congelare.", "ricordare": "Richiede una marinatura di una notte intera prima della cottura.", "link": "https://www.eataly.net/it_it/magazine/ricette/ricetta-originale-brasato"}, "Polpette al forno": {"porzioni": "3 porzioni", "tempo": "45 minuti", "ingredienti": [{"ingrediente": "Carne macinata mista", "qta": "400 g"}, {"ingrediente": "Pane raffermo", "qta": "50 g"}, {"ingrediente": "Latte", "qta": "q.b. per ammollare il pane"}, {"ingrediente": "Uovo", "qta": "1"}, {"ingrediente": "Parmigiano grattugiato", "qta": "40 g"}, {"ingrediente": "Prezzemolo fresco", "qta": "q.b."}, {"ingrediente": "Pangrattato", "qta": "per la panatura"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Ammolla il pane nel latte, poi strizzalo e sbriciolalo.", "Unisci carne, pane, uovo, parmigiano, prezzemolo, sale e pepe.", "Amalgama bene e forma delle polpette.", "Passale nel pangrattato, premendo bene.", "Disponile su una teglia foderata, distanziate, con un filo d'olio.", "Cuoci in forno già caldo a 200°C per 25 minuti, finché dorate."], "avanzi": "Meglio fresche, tendono ad asciugarsi il giorno dopo.", "freezer": "Si possono congelare crude.", "ricordare": "", "link": "https://www.agrodolce.it/ricette/polpette-al-forno"}, "Peperoni ripieni": {"porzioni": "3 porzioni", "tempo": "1 ora", "ingredienti": [{"ingrediente": "Peperoni grandi", "qta": "3"}, {"ingrediente": "Carne macinata mista", "qta": "350 g"}, {"ingrediente": "Uovo", "qta": "1"}, {"ingrediente": "Parmigiano grattugiato", "qta": "40 g"}, {"ingrediente": "Pangrattato", "qta": "40 g"}, {"ingrediente": "Prezzemolo fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Taglia i peperoni a metà per il lungo, elimina semi e filamenti.", "In una ciotola unisci carne, uovo, parmigiano, pangrattato, prezzemolo, sale e pepe.", "Farcisci i peperoni con il composto.", "Disponili in una teglia con un filo d'olio.", "Cuoci in forno già caldo a 180°C per 40-45 minuti, finché i peperoni sono morbidi."], "avanzi": "Buoni anche il giorno dopo, sia caldi che freddi.", "freezer": "Si possono congelare, crudi o già cotti.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/peperoni-ripieni/"}, "Melanzane ripiene": {"porzioni": "3 porzioni", "tempo": "1 ora", "ingredienti": [{"ingrediente": "Melanzane", "qta": "3"}, {"ingrediente": "Passata di pomodoro", "qta": "250 g"}, {"ingrediente": "Mozzarella", "qta": "150 g"}, {"ingrediente": "Aglio", "qta": "1 spicchio"}, {"ingrediente": "Basilico fresco", "qta": "q.b."}, {"ingrediente": "Olive nere", "qta": "facoltative, 50 g"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale", "qta": "q.b."}], "procedimento": ["Taglia le melanzane a metà per il lungo, incidi la polpa e cuocile in forno 15 minuti a 200°C.", "Scava la polpa con un cucchiaio, lasciando un bordo di circa mezzo centimetro.", "Trita la polpa e falla insaporire in padella con olio e aglio.", "Aggiungi la passata, sala e cuoci 10 minuti con basilico.", "Farcisci le melanzane con il composto.", "Distribuisci mozzarella a cubetti e olive, se le usi.", "Cuoci in forno a 200°C per altri 15-20 minuti, finché filanti e dorate."], "avanzi": "Buone anche il giorno dopo.", "freezer": "Si possono congelare dopo la cottura.", "ricordare": "", "link": "https://www.tavolartegusto.it/ricetta/ricetta-melanzane-ripiene/"}, "Carciofi alla romana": {"porzioni": "3 porzioni", "tempo": "40 minuti", "ingredienti": [{"ingrediente": "Carciofi grandi (mammole)", "qta": "4"}, {"ingrediente": "Aglio", "qta": "2 spicchi"}, {"ingrediente": "Prezzemolo fresco", "qta": "abbondante"}, {"ingrediente": "Mentuccia (o menta)", "qta": "q.b."}, {"ingrediente": "Limone", "qta": "1"}, {"ingrediente": "Olio EVO", "qta": "abbondante"}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Prepara una ciotola con acqua e succo di limone.", "Pulisci i carciofi eliminando le foglie esterne dure e la punta, svuota l'interno dalla barbetta.", "Man mano che li pulisci, immergili nell'acqua acidulata.", "Trita aglio, prezzemolo e mentuccia, farcisci l'interno di ogni carciofo con il trito.", "Disponi i carciofi capovolti (testa in giù) in un tegame stretto, ben accostati.", "Aggiungi olio abbondante, sale, pepe e un po' d'acqua fino a metà altezza dei carciofi.", "Copri e cuoci a fuoco basso 30-35 minuti, finché teneri."], "avanzi": "Buoni anche il giorno dopo, a temperatura ambiente.", "freezer": "Non indicati.", "ricordare": "", "link": "https://www.fattoincasadabenedetta.it/ricetta/carciofi-alla-romana/"}, "Gateau di patate": {"porzioni": "4 porzioni", "tempo": "1 ora", "ingredienti": [{"ingrediente": "Patate", "qta": "1 kg"}, {"ingrediente": "Uova", "qta": "2"}, {"ingrediente": "Latte", "qta": "100 ml"}, {"ingrediente": "Burro", "qta": "40 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "60 g"}, {"ingrediente": "Prosciutto cotto a cubetti", "qta": "120 g"}, {"ingrediente": "Mozzarella o provola", "qta": "200 g"}, {"ingrediente": "Pangrattato", "qta": "per la teglia"}, {"ingrediente": "Noce moscata", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Lessa le patate con la buccia, scolale e schiacciale ancora calde.", "Aggiungi burro, latte, uova, parmigiano, sale, pepe e noce moscata, mescola bene.", "Scola bene la mozzarella e tagliala a cubetti insieme al prosciutto.", "Unisci prosciutto e mozzarella al composto di patate.", "Imburra una teglia e cospargila di pangrattato.", "Versa il composto, livella e cospargi la superficie con altro pangrattato.", "Cuoci in forno già caldo a 180°C per 30-35 minuti, finché dorato in superficie."], "avanzi": "Buono anche il giorno dopo, si riscalda in forno.", "freezer": "Si può congelare, meglio crudo prima della cottura.", "ricordare": "", "link": "https://www.dissapore.com/ricette/gateau-di-patate-napoletano/"}, "Sformato di verdure e formaggio": {"porzioni": "3 porzioni", "tempo": "50 minuti", "ingredienti": [{"ingrediente": "Verdure miste (zucchine, carote, spinaci)", "qta": "circa 500 g"}, {"ingrediente": "Uova", "qta": "4"}, {"ingrediente": "Latte", "qta": "100 ml"}, {"ingrediente": "Formaggio grattugiato", "qta": "60 g"}, {"ingrediente": "Formaggio filante a cubetti", "qta": "100 g"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Lava e taglia le verdure a pezzetti piccoli.", "Saltale in padella con un filo d'olio finché morbide, salando.", "Sbatti le uova con latte, formaggio grattugiato, sale e pepe.", "Unisci le verdure intiepidite e il formaggio filante a cubetti.", "Versa in una teglia foderata con carta forno.", "Cuoci in forno già caldo a 180°C per 30-35 minuti, finché dorato e sodo al centro."], "avanzi": "Buono anche freddo, ottimo per il pranzo.", "freezer": "Si può congelare già porzionato.", "ricordare": "", "link": "https://www.finedininglovers.it/esplora/ricette/frittata-al-forno-con-verdure"}, "Pasta con stracchino e zucchine": {"porzioni": "3 porzioni", "tempo": "25–30 minuti", "ingredienti": [{"ingrediente": "Pasta", "qta": "210 g"}, {"ingrediente": "Zucchine medie", "qta": "3"}, {"ingrediente": "Stracchino", "qta": "150 g"}, {"ingrediente": "Scalogno piccolo", "qta": "1"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale", "qta": "q.b."}, {"ingrediente": "Pepe", "qta": "q.b."}, {"ingrediente": "Parmigiano", "qta": "facoltativo"}], "procedimento": ["Taglia le zucchine a rondelle sottili o a dadini.", "Cuocile in padella con lo scalogno tritato e un filo d'olio per 10-15 minuti, finché appassiscono.", "Cuoci la pasta in abbondante acqua salata.", "Scolala nella padella con le zucchine, tenendo da parte un mestolino di acqua di cottura.", "Spegni il fuoco e aggiungi lo stracchino a pezzetti, mantecando finché non si scioglie (allunga con l'acqua di cottura se serve).", "Completa con pepe e, se vuoi, una spolverata di parmigiano."], "avanzi": "Sì, ma consumali il prima possibile: lo stracchino ricotto tende a diventare gommoso.", "freezer": "Sconsigliato: lo stracchino cambia consistenza da scongelato.", "ricordare": "", "link": "https://blog.giallozafferano.it/lebistro/pasta-con-zucchine-e-stracchino/"}, "Pollo alla senape": {"porzioni": "3 porzioni", "tempo": "25–30 minuti", "ingredienti": [{"ingrediente": "Petto di pollo", "qta": "450 g (3 fette)"}, {"ingrediente": "Farina", "qta": "1 cucchiaio"}, {"ingrediente": "Senape di Digione", "qta": "2 cucchiai"}, {"ingrediente": "Senape in grani", "qta": "1 cucchiaio"}, {"ingrediente": "Miele", "qta": "1 cucchiaio"}, {"ingrediente": "Panna da cucina", "qta": "100 ml"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Taglia il petto di pollo a fette e infarinale leggermente.", "Scalda un filo d'olio in padella e rosola il pollo 2-3 minuti per lato, poi mettilo da parte.", "Nella stessa padella unisci senape di Digione, senape in grani e miele con un goccio di acqua.", "Aggiungi la panna e fai addensare leggermente la salsa a fuoco basso.", "Rimetti il pollo in padella e lascialo insaporire nella salsa per 8-10 minuti, girandolo.", "Aggiusta di sale e pepe e servi caldo."], "avanzi": "Sì, buono anche riscaldato.", "freezer": "Sì, congela bene insieme alla salsa.", "ricordare": "", "link": "https://www.cookist.it/pollo-alla-senape-ricetta/"}, "Pollo alla piastra": {"porzioni": "3 porzioni", "tempo": "20–25 minuti + marinatura", "ingredienti": [{"ingrediente": "Petto di pollo", "qta": "450 g (3 fette)"}, {"ingrediente": "Limone", "qta": "1 (succo e scorza)"}, {"ingrediente": "Rosmarino", "qta": "1 rametto"}, {"ingrediente": "Aglio", "qta": "1 spicchio, facoltativo"}, {"ingrediente": "Olio EVO", "qta": "2 cucchiai"}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Incidi leggermente le fette di pollo così la marinatura penetra meglio.", "Mescola olio, succo e scorza di limone, rosmarino tritato, aglio schiacciato, sale e pepe.", "Lascia insaporire il pollo nella marinata 15-30 minuti (va bene anche più a lungo se hai tempo).", "Scalda bene una piastra o padella antiaderente.", "Cuoci il pollo 4-5 minuti per lato, finché è dorato fuori e cotto dentro.", "Servi caldo, volendo con altro limone fresco."], "avanzi": "Sì, ottimo anche freddo, per esempio a fettine su un’insalata.", "freezer": "Non adatta, meglio cucinarla fresca.", "ricordare": "", "link": "https://www.cookist.it/pollo-alla-piastra-la-ricetta/"}, "Scaloppine ai funghi": {"porzioni": "3 porzioni", "tempo": "30–35 minuti", "ingredienti": [{"ingrediente": "Fettine di vitello", "qta": "450 g"}, {"ingrediente": "Funghi champignon", "qta": "300 g"}, {"ingrediente": "Farina", "qta": "30 g"}, {"ingrediente": "Burro", "qta": "30 g"}, {"ingrediente": "Aglio", "qta": "1 spicchio"}, {"ingrediente": "Vino bianco", "qta": "mezzo bicchiere, facoltativo"}, {"ingrediente": "Prezzemolo", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Passa le fettine di vitello nella farina, scuotendo quella in eccesso.", "Sciogli il burro con un filo d'olio in padella e rosola le scaloppine 2-3 minuti per lato, poi mettile da parte.", "Nella stessa padella fai dorare l’aglio, aggiungi i funghi puliti e affettati e cuocili 6-8 minuti.", "Sfuma con il vino bianco, se lo usi, e lascia evaporare.", "Rimetti le scaloppine in padella insieme ai funghi e fai insaporire un paio di minuti.", "Completa con prezzemolo tritato, sale e pepe."], "avanzi": "Sì, ma la carne è più buona appena fatta.", "freezer": "Non adatta.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/scaloppine-ai-funghi/"}, "Straccetti di manzo rucola e grana": {"porzioni": "3 porzioni", "tempo": "15–20 minuti", "ingredienti": [{"ingrediente": "Straccetti di manzo", "qta": "450 g"}, {"ingrediente": "Rucola", "qta": "80 g"}, {"ingrediente": "Grana o parmigiano a scaglie", "qta": "60 g"}, {"ingrediente": "Limone", "qta": "succo di mezzo"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Scalda bene una padella antiaderente, senza olio.", "Cuoci gli straccetti pochi minuti a fuoco vivace, girandoli, finché rosolati ma ancora morbidi.", "Sala a fine cottura e trasferiscili su un piatto.", "Condisci la rucola con un filo d’olio, succo di limone e un pizzico di sale.", "Componi il piatto con gli straccetti caldi, la rucola condita sopra e le scaglie di grana.", "Completa con una macinata di pepe."], "avanzi": "Sì, ma meglio la carne ancora tiepida, non fredda di frigo.", "freezer": "Non adatta.", "ricordare": "", "link": "https://www.lacucinaimperfetta.com/straccetti-di-manzo-con-la-rucola/"}, "Salsiccia al forno con patate e peperoni": {"porzioni": "3 porzioni", "tempo": "45–50 minuti", "ingredienti": [{"ingrediente": "Salsiccia", "qta": "500 g"}, {"ingrediente": "Patate", "qta": "500 g"}, {"ingrediente": "Peperoni", "qta": "2"}, {"ingrediente": "Aglio", "qta": "1-2 spicchi"}, {"ingrediente": "Rosmarino", "qta": "qualche rametto"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Taglia le patate a spicchi o tocchetti e i peperoni a listarelle.", "Disponili in una teglia con olio, aglio in camicia, rosmarino, sale e pepe.", "Adagia sopra la salsiccia, intera o a pezzi.", "Inforna a 200°C per 35-40 minuti, girando a metà cottura.", "Se la salsiccia si asciuga troppo prima che le verdure siano cotte, copri la teglia con alluminio.", "Sforna quando patate e peperoni sono morbidi e dorati."], "avanzi": "Sì function isStaple(ingrediente){
  const s = (ingrediente||'').toLowerCase();
  // parola intera, non sottostringa: altrimenti "pepe" intercetta anche "Peperoni"
  return STAPLE_KEYWORDS.some(k => new RegExp(`\\b${k}\\b`).test(s));
}

// Basilari ("di solito li hai già") raccolti dal menù corrente, uniti per solo
// nome (non nome+quantità: altrimenti lo stesso ingrediente con una qta scritta
// in modo leggermente diverso da una ricetta all'altra compariva due volte).
// Usata sia dalla lista della spesa sia dalla Dispensa (per mostrare quelli
// confermati come "già in casa").
function computeStapleList(){
  const flat = [];
  DATA.week1.forEach((d,i)=>{
    const name = effectiveRecipeName(i);
    getIngredientsFor(name).forEach((it,idx)=>{
      if(isStaple(it.ingrediente)) flat.push({ key:`d${i}_${idx}`, ingrediente:it.ingrediente, qta:it.qta, context:`${d.giorno} · ${name}` });
    });
  });
  DATA.generalShopping.forEach((it,idx)=>{
    if(isStaple(it.ingrediente)) flat.push({ key:`gen_${idx}`, ingrediente:it.ingrediente, qta:it.qta, context:'Ogni settimana' });
  });
  const merged = {};
  flat.forEach(it=>{
    const mergeKey = (it.ingrediente||'').trim().toLowerCase();
    if(!merged[mergeKey]) merged[mergeKey] = { ingrediente: it.ingrediente, qta: it.qta, keys: [it.key], contexts: [it.context] };
    else{
      merged[mergeKey].keys.push(it.key);
      if(!merged[mergeKey].contexts.includes(it.context)) merged[mergeKey].contexts.push(it.context);
    }
  });
  return Object.values(merged);
}

// Inventario unico (dispensa/ripostiglio/frigo/freezer distinti solo dal
// campo luogo): le stesse voci vengono anche aggiunte/incrementate in
// automatico quando si spunta un articolo in Spesa. Quantità = un contatore
// numerico (stepper +/- in UI); finché non è impostata (o è 0) la voce non
// compare nell'elenco.
function upsertPantryItem(nome, luogo){
  const trimmedName = (nome||'').trim();
  if(!trimmedName) return;
  const key = trimmedName.toLowerCase();
  const existing = state.pantryItems[key];
  const currentQty = (existing && typeof existing.qty === 'number') ? existing.qty : 0;
  state.pantryItems[key] = {
    nome: trimmedName,
    qty: currentQty + 1,
    luogo: (existing && existing.luogo) || luogo || 'dispensa'
  };
}

function classifyDept(ingrediente){
  const s = (ingrediente||'').toLowerCase();
  for(const [kw, dept] of DEPT_RULES){ if(s.includes(kw)) return dept; }
  return 'altro';
}

// Firebase Realtime Database vieta "." "#" "$" "/" "[" "]" nelle chiavi, ma
// alcuni nomi di ricetta le contengono (es. "Orata/branzino al forno con
// patate", usato come chiave in recipeIngredients): le codifichiamo solo nel
// payload verso Firebase, lasciando invariato il formato locale/JSON.
function fbKeyEncode(k){ return k.replace(/[%.#$\/\[\]]/g, c => '%'+c.charCodeAt(0).toString(16).padStart(2,'0')); }
function fbKeyDecode(k){ return k.replace(/%([0-9a-fA-F]{2})/g, (_,h) => String.fromCharCode(parseInt(h,16))); }
function encodeKeysForFirebase(obj){
  const out = {};
  for(const k in obj) out[fbKeyEncode(k)] = obj[k];
  return out;
}
function decodeKeysFromFirebase(obj){
  const out = {};
  for(const k in obj) out[fbKeyDecode(k)] = obj[k];
  return out;
}

// Mostra il gate di login finché non c'è un utente autenticato; risolve
// subito se Firebase non è raggiungibile (offline: si procede con la sola
// cache locale, coerente col fallback già previsto in loadState/persist).
function waitForAuth(){
  return new Promise((resolve)=>{
    if(!window.cookpopAuth){ resolve(); return; }
    const gate = document.getElementById('login-gate');
    const emailInput = document.getElementById('login-email');
    const passInput = document.getElementById('login-password');
    const errorBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');
    const logoutBtn = document.getElementById('logout-btn');
    let resolved = false;

    window.cookpopAuth.onAuthStateChanged((user)=>{
      gate.style.display = user ? 'none' : 'flex';
      if(logoutBtn) logoutBtn.style.display = user ? 'block' : 'none';
      if(user && !resolved){ resolved = true; resolve(); }
    });

    async function doLogin(){
      errorBox.textContent = '';
      submitBtn.disabled = true;
      try{
        await window.cookpopAuth.signIn(emailInput.value.trim(), passInput.value);
      }catch(e){
        errorBox.textContent = 'Email o password non corretti.';
      }
      submitBtn.disabled = false;
    }
    submitBtn.addEventListener('click', doLogin);
    passInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doLogin(); });
    if(logoutBtn) logoutBtn.addEventListener('click', ()=> window.cookpopAuth.signOut());
  });
}

async function loadState(){
  // Cache locale istantanea (utile a schermo pieno offline o a connessione lenta)
  try{
    const cached = localStorage.getItem('quaderno-state');
    if(cached){
      const saved = JSON.parse(cached);
      Object.assign(state, saved);
      if(saved.recipeIngredients) state.recipeIngredients = saved.recipeIngredients;
    }
  }catch(e){ /* nessuno stato salvato ancora */ }

  await firebaseReady;
  if(!window.cookpopSync) return;

  await new Promise((resolve)=>{
    let done = false;
    window.cookpopSync.onChange((saved)=>{
      if(saved){
        if(saved.recipeIngredients) saved.recipeIngredients = decodeKeysFromFirebase(saved.recipeIngredients);
        if(saved.pantryItems) saved.pantryItems = decodeKeysFromFirebase(saved.pantryItems);
        if(saved.freezerItems) saved.freezerItems = decodeKeysFromFirebase(saved.freezerItems);
        Object.assign(state, saved);
        if(saved.recipeIngredients) state.recipeIngredients = saved.recipeIngredients;
        if(saved.pantryItems) state.pantryItems = saved.pantryItems;
        if(saved.freezerItems) state.freezerItems = saved.freezerItems;
        try{ localStorage.setItem('quaderno-state', JSON.stringify(saved)); }catch(e){}
      }
      render();
      if(!done){ done = true; resolve(); }
    });
    setTimeout(()=>{ if(!done){ done = true; resolve(); } }, 2500);
  });
}

      pantrySeeded: state.pantrySeeded,
      pantryQtyMigrated: state.pantryQtyMigrated,
      pantryView: state.pantryView
    };
    try{ localStorage.setItem('quaderno-state', JSON.stringify(payload)); }catch(e){}
    try{
      await firebaseReady;
      if(window.cookpopSync){
        // Firebase rifiuta l'intero salvataggio se un solo campo è undefined
        // (es. appliedForcedWeekVersion prima che venga mai impostato): il
        // giro JSON lo elimina, coerente con come viene già trattato in locale.
        const fbPayload = JSON.parse(JSON.stringify({
          ...payload,
          recipeIngredients: encodeKeysForFirebase(payload.recipeIngredients),
          pantryItems: encodeKeysForFirebase(payload.pantryItems)
        }));
        await window.cookpopSync.save(fbPayload);
      }
      const hint = document.querySelector('.save-hint');
      if(hint){ hint.textContent = 'salvato ✓'; setTimeout(()=>{ if(hint) hint.textContent=''; }, 1500); }
    }catch(e){ console.error('Errore salvataggio', e); }
  }, 350);
}

function effectiveRecipeName(i){
  if(state.weekOverrides[i]) return state.weekOverrides[i];
  if(state.weekBaseline && state.weekBaseline[i]) return state.weekBaseline[i];
  return DATA.week1[i].cena;
}
// Ricetta "vera" del catalogo per il giorno i: se sostituita manualmente è la sostituzione,
// se fa parte di un menù generato è la ricetta generata, altrimenti si prova ad abbinarla al catalogo (catalogMatch)
function effectiveRecipeMeta(i){
  const overrideName = state.weekOverrides[i];
  if(overrideName) return recipeByName[overrideName] || null;
  if(state.weekBaseline && state.weekBaseline[i]) return recipeByName[state.weekBaseline[i]] || null;
  const match = DATA.week1[i].catalogMatch;
  return match ? recipeByName[match] : null;
}
function effectiveCategoria(i){
  const rec = effectiveRecipeMeta(i);
  if(rec) return rec.categoriaNew;
  return DATA.week1[i].fallbackCategoria || '';
}

const MONTHS_IT = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function upcomingWeekLabel(){
  const today = new Date();
  const day = today.getDay(); // 0=dom, 1=lun ... 6=sab
  const diffToMonday = (8 - day) % 7; // se oggi è lunedì, diff=0 (settimana in corso conta come "a venire")
  const monday = new Date(today);
  monday.setDate(today.getDate() + diffToMonday);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const dm = monday.getDate(), ds = sunday.getDate();
  const mm = MONTHS_IT[monday.getMonth()], ms = MONTHS_IT[sunday.getMonth()];
  if(mm === ms) return `${dm}–${ds} ${mm}`;
  return `${dm} ${mm} – ${ds} ${ms}`;
}

function currentSeasonKey(){
  const m = new Date().getMonth(); // 0=gen ... 11=dic
  if(m >= 2 && m <= 4) return 'primavera';   // mar-mag
  if(m >= 5 && m <= 7) return 'estate';      // giu-ago
  if(m >= 8 && m <= 10) return 'autunno';    // set-nov
  return 'inverno';                          // dic-feb
}

function generateWeekMenu(){
  const season = currentSeasonKey();
  let pool = DATA.recipes.filter(r => r.stagioni.includes(season) || r.stagioni.includes('tutto'));
  if(pool.length < 7) pool = DATA.recipes.slice(); // fallback di sicurezza, non dovrebbe servire

  // mescolo
  const shuffled = pool.slice();
  for(let i = shuffled.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  const picked = [];
  const usedNames = new Set();
  const catCount = {};
  let prevCat = null;

  const WEEKDAY_TEMPO = ['express','veloce','normale']; // fino a 30-45 min

  for(let day = 0; day < 7; day++){
    const isWeekday = day <= 4; // 0=Lun ... 4=Ven, 5=Sab, 6=Dom
    // candidati non ancora usati, ordinati per preferenza: categoria diversa dal giorno prima
    // e categoria meno usata finora nella settimana
    let candidates = shuffled.filter(r => !usedNames.has(r.nome));
    if(isWeekday){
      const limited = candidates.filter(r => WEEKDAY_TEMPO.includes(r.tempoBucket));
      if(limited.length > 0) candidates = limited; // in settimana solo ricette fino a 30-45 min, se disponibili
    }
    if(candidates.length === 0) candidates = shuffled; // esaurito il pool, riparto (raro)

    candidates = candidates.slice().sort((a,b)=>{
      const aSamePrev = a.categoriaNew === prevCat ? 1 : 0;
      const bSamePrev = b.categoriaNew === prevCat ? 1 : 0;
      if(aSamePrev !== bSamePrev) return aSamePrev - bSamePrev; // penalizza stessa categoria di ieri
      const aCount = catCount[a.categoriaNew] || 0;
      const bCount = catCount[b.categoriaNew] || 0;
      return aCount - bCount; // preferisci categoria meno usata
    });

    const chosen = candidates[0];
    picked.push(chosen);
    usedNames.add(chosen.nome);
    catCount[chosen.categoriaNew] = (catCount[chosen.categoriaNew] || 0) + 1;
    prevCat = chosen.categoriaNew;
  }

  const newBaseline = {};
  picked.forEach((r, i) => { newBaseline[i] = r.nome; });
  state.weekBaseline = newBaseline;
  state.weekOverrides = {};
  state.expandedDay = null;
  state.swapOpenDay = null;
  persist();
  render();
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{ b.classList.toggle('active', b.dataset.tab === state.tab); });
  const panel = document.getElementById('panel');
  if(state.tab === 'menu') panel.innerHTML = renderMenu();
  if(state.tab === 'spesa') panel.innerHTML = renderSpesa();
  if(state.tab === 'prep') panel.innerHTML = renderPrep();
  if(state.tab === 'dispensa') panel.innerHTML = renderDispensa();
  attachHandlers();
}

function renderSpesa(){
  // costruisco una lista piatta di tutti gli articoli, con contesto e chiave stabile
  const flat = [];
  DATA.week1.forEach((d,i)=>{
    const name = effectiveRecipeName(i);
    const items = getIngredientsFor(name);
    items.forEach((it,idx)=>{
      flat.push({ key:`d${i}_${idx}`, ingrediente:it.ingrediente, qta:it.qta, dove:it.dove, note:it.note, context:`${d.giorno} · ${name}`, staple: isStaple(it.ingrediente) });
    });
  });
  DATA.generalShopping.forEach((it,idx)=>{
    flat.push({ key:`gen_${idx}`, ingrediente:it.ingrediente, qta:it.qta, dove:it.dove, note:it.note, context:'Ogni settimana', staple: isStaple(it.ingrediente) });
  });

  const mainFlat = flat.filter(it => !it.staple);

  const total = mainFlat.length;
  const done = mainFlat.filter(it=>state.shopChecked[it.key]).length;

  function itemRow(keys, ingrediente, qta, note, subtitle){
    const checked = keys.every(k=>state.shopChecked[k]);
    return `
    <label class="shop-item ${checked?'checked':''}">
      <input type="checkbox" data-shop-keys="${keys.join(',')}" data-shop-name="${escapeAttr(ingrediente)}" ${checked?'checked':''}>
      <span>
        <span class="item-name">${escapeHtml(ingrediente)}</span>
        <span class="item-detail">${escapeHtml(qta||'')}${subtitle ? ' · ' + escapeHtml(subtitle) : ''}${note ? ' · ' + escapeHtml(note) : ''}</span>
      </span>
    </label>`;
  }

  const stapleList = computeStapleList();
  const staplesHtml = stapleList.length ? `
    <div class="staples-block">
      <div class="staples-title">🏠 Di solito li hai già</div>
      <p class="staples-hint">Spuntali se non ti servono — restano fuori dalla lista qui sopra.</p>
      ${stapleList.map(it=>itemRow(it.keys, it.ingrediente, it.qta, '', it.contexts.join(' + '))).join('')}
    </div>` : '';

  let body = '';
  if(state.shopView === 'reparto'){
    // classifico ogni articolo per reparto, e per la verdura forzo il negozio Fruttivendolo
    const classified = mainFlat.map(it=>{
      const dept = classifyDept(it.ingrediente);
      const store = dept === 'verdura' ? 'Fruttivendolo' : (it.dove || 'Da definire');
      return {...it, dept, store};
    });
    // unisco articoli identici (stesso ingrediente + stessa quantità) comparsi in più ricette
    const merged = {};
    classified.forEach(it=>{
      const mergeKey = (it.ingrediente||'').trim().toLowerCase() + '|' + (it.qta||'').trim().toLowerCase();
      if(!merged[mergeKey]){
        merged[mergeKey] = { ingrediente: it.ingrediente, qta: it.qta, note: it.note, dept: it.dept, store: it.store, keys: [it.key], contexts: [it.context] };
      } else {
        merged[mergeKey].keys.push(it.key);
        if(!merged[mergeKey].contexts.includes(it.context)) merged[mergeKey].contexts.push(it.context);
      }
    });
    const mergedList = Object.values(merged);

    const stores = {};
    mergedList.forEach(it=>{
      if(!stores[it.store]) stores[it.store] = [];
      stores[it.store].push(it);
    });
    body = Object.entries(stores).map(([store, items])=>{
      const byDept = {};
      items.forEach(it=>{
        if(!byDept[it.dept]) byDept[it.dept] = [];
        byDept[it.dept].push(it);
      });
      const deptSections = DEPT_ORDER
        .filter(dept => byDept[dept] && byDept[dept].length)
        .map(dept => `
          <div class="dept-block">
            <div class="dept-title"><span class="dept-icon">${DEPT_ICON[dept]}</span>${DEPT_LABEL[dept]}</div>
            ${byDept[dept].map(it=>itemRow(it.keys, it.ingrediente, it.qta, it.note, it.contexts.join(' + '))).join('')}
          </div>`).join('');
      return `
      <div class="shop-day-group">
        <div class="shop-day-title">${escapeHtml(store)}</div>
        ${deptSections}
      </div>`;
    }).join('');
  } else {
    body = DATA.week1.map((d,i)=>{
      const name = effectiveRecipeName(i);
      const dayItems = mainFlat.filter(it => it.context === `${d.giorno} · ${name}`);
      const rows = dayItems.length
        ? dayItems.map(it=>itemRow([it.key], it.ingrediente, it.qta, it.note, it.dove)).join('')
        : `<div class="ing-empty">Nessun ingrediente salvato — aprilo dal Menù e aggiungili dalla scheda ricetta.</div>`;
      return `
      <div class="shop-day-group">
        <div class="shop-day-title">${escapeHtml(d.giorno)} · ${escapeHtml(name)}</div>
        ${rows}
      </div>`;
    }).join('');
    const genContext = mainFlat.filter(it => it.context === 'Ogni settimana');
    if(genContext.length){
      body += `
      <div class="shop-day-group">
        <div class="shop-day-title">Ogni settimana</div>
        ${genContext.map(it=>itemRow([it.key], it.ingrediente, it.qta, it.note, it.dove)).join('')}
      </div>`;
    }
  }

  const missingDays = DATA.week1
    .map((d,i)=>({giorno:d.giorno, nome: effectiveRecipeName(i)}))
    .filter(d => !(getIngredientsFor(d.nome) && getIngredientsFor(d.nome).length));
  const missingBanner = missingDays.length ? `
    <div class="missing-ing-banner">
      ⚠️ Ingredienti non ancora salvati per: ${missingDays.map(d=>`${escapeHtml(d.giorno)} (${escapeHtml(d.nome)})`).join(', ')}. Aprili dal Menù per aggiungerli.
    </div>` : '';

  return `
    <h2 class="section-title">Spesa</h2>
    <p class="section-sub">Si aggiorna in automatico in base al menù attuale — spuntare un articolo lo aggiunge anche in Dispensa</p>
    ${missingBanner}
    <div class="view-toggle">
      <button class="view-btn ${state.shopView!=='reparto'?'active':''}" data-shop-view="giorno">Per giorno</button>
      <button class="view-btn ${state.shopView==='reparto'?'active':''}" data-shop-view="reparto">Per reparto</button>
    </div>
    <div class="shop-progress">${done} / ${total} presi</div>
    <button class="reset-btn" id="reset-shop">Svuota spunte</button>
    ${body}
    ${staplesHtml}
  `;
}

  function selectHtml(id, label, order, labelMap, current){
    return `<select id="${id}"><option value="">${label}</option>${order.map(v=>`<option value="${v}" ${current===v?'selected':''}>${escapeHtml(labelMap[v])}</option>`).join('')}</select>`;

  const activeCount = ['cat','tempo','pian','stagione','avanzi','freezer','grad','attrezz'].filter(k=>state.filters[k]).length;

  const filtersModal = state.filtersOpen ? `

            </div>
          </div>
          <div class="filter-group">
            <div class="filter-group-label">⏱ Tempo</div>
            ${selectHtml('f-tempo', 'Tutti i tempi', TEMPO_ORDER, TEMPO_LABEL, state.filters.tempo)}
          </div>
          <div class="filter-group">
            <div class="filter-group-label">📅 Pianificazione</div>
            ${selectHtml('f-pian', 'Qualsiasi', PIAN_ORDER, PIAN_LABEL, state.filters.pian)}
          </div>
          <div class="filter-group">
            <div class="filter-group-label">🌦 Stagione</div>
            ${selectHtml('f-stagione', 'Tutte le stagioni', STAGIONE_ORDER, STAGIONE_LABEL, state.filters.stagione)}
          </div>
          <div class="filter-group">

function renderDispensa(){
  // Un'unica lista per dispensa/ripostiglio/frigo/freezer, distinti solo
  // dall'icona del luogo (si cambia toccandola). Si riempie da sola quando
  // si spunta un articolo in Spesa, e si modifica liberamente a mano. Una
  // voce senza quantità (0) non compare: la quantità è un contatore che si
  // vede solo una volta impostato.
  const items = Object.entries(state.pantryItems)
    .map(([key, it])=>({ key, nome: it.nome, qty: it.qty, luogo: it.luogo || 'dispensa' }))
    .filter(it => typeof it.qty === 'number' && it.qty > 0);

  function itemRow(it){
    const editing = state.pantryEditingKey === it.key;
    return `
    <div class="inv-item">
      <button class="inv-luogo" data-luogo-toggle="${escapeAttr(it.key)}" type="button" title="Luogo: ${escapeAttr(LUOGO_LABEL[it.luogo])} — tocca per scegliere">${LUOGO_ICON[it.luogo]}</button>
      ${state.pantryLuogoPicker === it.key ? `
      <div class="luogo-picker-backdrop" data-luogo-picker-close></div>
      <div class="luogo-picker">
        ${LUOGO_ORDER.map(l=>`<button type="button" class="luogo-picker-opt${l===it.luogo?' active':''}" data-luogo-set="${escapeAttr(it.key)}" data-luogo-value="${l}" title="${escapeAttr(LUOGO_LABEL[l])}">${LUOGO_ICON[l]}</button>`).join('')}
      </div>` : ''}
      <span class="inv-name">${escapeHtml(it.nome)}</span>
      <span class="qty-stepper">
        <button class="qty-btn" type="button" data-qty-dec="${escapeAttr(it.key)}" aria-label="Diminuisci">−</button>
        ${editing
          ? `<input type="number" min="0" class="qty-input" value="${it.qty}" data-qty-edit="${escapeAttr(it.key)}">`
          : `<span class="qty-num" data-qty-show="${escapeAttr(it.key)}">${it.qty}</span>`}
        <button class="qty-btn" type="button" data-qty-inc="${escapeAttr(it.key)}" aria-label="Aumenta">+</button>
      </span>
      <button class="inv-remove" data-inv-remove="${escapeAttr(it.key)}" type="button" aria-label="Elimina ${escapeAttr(it.nome)}"><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="0 0 256 256"><path fill="currentColor" d="M216 48h-40v-8a24 24 0 0 0-24-24h-48a24 24 0 0 0-24 24v8H40a8 8 0 0 0 0 16h8v144a16 16 0 0 0 16 16h128a16 16 0 0 0 16-16V64h8a8 8 0 0 0 0-16M96 40a8 8 0 0 1 8-8h48a8 8 0 0 1 8 8v8H96Zm96 168H64V64h128Zm-80-104v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0m48 0v64a8 8 0 0 1-16 0v-64a8 8 0 0 1 16 0"></path></svg></button>
    </div>`;
  }

  let body;
  if(!items.length){
    body = `<p class="ing-empty">Vuota per ora — spunta qualcosa in Spesa o aggiungi qui sotto (poi tocca il + per impostare quanti ne hai).</p>`;
  } else if(state.pantryView === 'luogo'){
    const byLuogo = {};
    items.forEach(it=>{ (byLuogo[it.luogo] = byLuogo[it.luogo] || []).push(it); });
    body = LUOGO_ORDER.filter(l=>byLuogo[l] && byLuogo[l].length).map(l=>`
      <div class="dept-block">
        <div class="dept-title"><span class="dept-icon">${LUOGO_ICON[l]}</span>${LUOGO_LABEL[l]}</div>
        ${byLuogo[l].sort((a,b)=>a.nome.localeCompare(b.nome,'it')).map(itemRow).join('')}
      </div>`).join('');
  } else {
    const byDept = {};
    items.forEach(it=>{ const d = classifyDept(it.nome); (byDept[d] = byDept[d] || []).push(it); });
    body = DEPT_ORDER.filter(d=>byDept[d] && byDept[d].length).map(d=>`
      <div class="dept-block">
        <div class="dept-title"><span class="dept-icon">${DEPT_ICON[d]}</span>${DEPT_LABEL[d]}</div>
        ${byDept[d].sort((a,b)=>a.nome.localeCompare(b.nome,'it')).map(itemRow).join('')}
      </div>`).join('');
  }

  return `
    <h2 class="section-title">Dispensa</h2>
    <p class="section-sub">Si aggiorna da sola quando spunti qualcosa in Spesa — aggiungi o togli a mano quello che manca</p>
    <div class="view-toggle">
      <button class="view-btn ${state.pantryView!=='luogo'?'active':''}" data-pantry-view="categoria">Per categoria</button>
      <button class="view-btn ${state.pantryView==='luogo'?'active':''}" data-pantry-view="luogo">Per luogo</button>
    </div>
    ${body}
    <div class="inv-add-row">
      <select id="inv-add-luogo">
        ${LUOGO_ORDER.map(l=>`<option value="${l}">${LUOGO_ICON[l]} ${LUOGO_LABEL[l]}</option>`).join('')}
      </select>
      <input type="text" id="inv-add-name" placeholder="Nuovo ingrediente">
      <button id="inv-add-btn" type="button">+ Aggiungi</button>
    </div>
    <div class="save-hint"></div>
  `;
}

function escapeHtml(s){ if(s===undefined || s===null) return ''; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function attachHandlers(){
  document.querySelectorAll('[data-shop-view]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.shopView = e.target.dataset.shopView;
      render();
    });
  });

  document.querySelectorAll('.shop-item input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const keys = e.target.dataset.shopKeys.split(',');
      keys.forEach(k=>{ state.shopChecked[k] = e.target.checked; });
      if(e.target.checked) upsertPantryItem(e.target.dataset.shopName, 'dispensa');
      persist(); render();
    });
  });
  const resetBtn = document.getElementById('reset-shop');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{ state.shopChecked = {}; persist(); render(); });

  document.querySelectorAll('[data-open-swap]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const i = parseInt(e.target.dataset.openSwap);
      state.swapOpenDay = state.swapOpenDay === i ? null : i;
      render();
    });
  });
  const genWeekBtn = document.getElementById('generate-week');
  if(genWeekBtn) genWeekBtn.addEventListener('click', ()=>{ generateWeekMenu(); });

  document.querySelectorAll('[data-reset-swap]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const i = e.target.dataset.resetSwap;
      delete state.weekOverrides[i];
      state.swapOpenDay = null;
      persist(); render();
    });
  });
  document.querySelectorAll('[data-swap-cat]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const i = e.target.dataset.swapDay;
      if(!state.swapFilters[i]) state.swapFilters[i] = {search:'', cat:'same'};
      state.swapFilters[i].cat = e.target.dataset.swapCat;
      render();
    });
  });
  document.querySelectorAll('[data-swap-search]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = e.target.dataset.swapSearch;
      if(!state.swapFilters[i]) state.swapFilters[i] = {search:'', cat:'same'};
      state.swapFilters[i].search = e.target.value;
      render();
      const el = document.querySelector(`[data-swap-search="${i}"]`);
      if(el){ el.focus(); el.selectionStart = el.value.length; }
    });
  });
  document.querySelectorAll('[data-swap-pick]').forEach(row=>{
    row.addEventListener('click', e=>{
      const el = e.currentTarget;
      const i = el.dataset.swapDay;
      const recipeName = el.dataset.swapPick;
      state.weekOverrides[i] = recipeName;
      state.swapOpenDay = null;
      persist(); render();
    });
  });

  document.querySelectorAll('[data-toggle-day]').forEach(el=>{
    el.addEventListener('click', e=>{
      const i = parseInt(e.target.dataset.toggleDay);
      state.expandedDay = state.expandedDay === i ? null : i;
      render();
    });
  });

  document.querySelectorAll('[data-add-ing]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const i = e.target.dataset.addIng;
      const nameInput = document.querySelector(`[data-ning="${i}"]`);
      const qtaInput = document.querySelector(`[data-nqta="${i}"]`);
      const ingrediente = nameInput.value.trim();
      const qta = qtaInput.value.trim();
      if(!ingrediente) return;
      const recipeName = effectiveRecipeName(parseInt(i));
      if(!state.recipeIngredients[recipeName]) state.recipeIngredients[recipeName] = [];
      state.recipeIngredients[recipeName].push({ingrediente, qta, dove:'', note:''});
      persist(); render();
      state.expandedDay = parseInt(i);
    });
  });

  document.querySelectorAll('[data-toggle-recipe]').forEach(el=>{
    el.addEventListener('click', e=>{
      const name = el.dataset.toggleRecipe;
      state.expandedRecipe = state.expandedRecipe === name ? null : name;
      render();
    });
  });

  document.querySelectorAll('[data-add-ing-recipe]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const recipeName = e.target.dataset.addIngRecipe;
      const nameInput = document.querySelector(`[data-rning="${CSS.escape(recipeName)}"]`);
      const qtaInput = document.querySelector(`[data-rnqta="${CSS.escape(recipeName)}"]`);
      const ingrediente = nameInput.value.trim();
      const qta = qtaInput.value.trim();
      if(!ingrediente) return;
      if(!state.recipeIngredients[recipeName]) state.recipeIngredients[recipeName] = [];
      state.recipeIngredients[recipeName].push({ingrediente, qta, dove:'', note:''});
      persist(); render();
    });
  });

  document.querySelectorAll('[data-open-filters]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.filtersOpen = true; render(); });
  });
  document.querySelectorAll('[data-close-filters]').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.hasAttribute('data-stop-close')) return;
      state.filtersOpen = false; render();
    });
  });
  const stopClose = document.querySelector('[data-stop-close]');
  if(stopClose) stopClose.addEventListener('click', e=>{ e.stopPropagation(); });
  const clearFilters = document.getElementById('clear-filters');
  if(clearFilters) clearFilters.addEventListener('click', ()=>{
    state.filters = { cat:'', tempo:'', pian:'', stagione:'', avanzi:'', freezer:'', grad:'', attrezz:'', search: state.filters.search };
    render();
  });

  const fSearch = document.getElementById('f-search');
  if(fSearch) fSearch.addEventListener('input', e=>{ state.filters.search = e.target.value; render(); const el=document.getElementById('f-search'); el.focus(); el.selectionStart = el.value.length; });

  document.querySelectorAll('.chip-row [data-f]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const f = e.target.dataset.f, v = e.target.dataset.v;
      state.filters[f] = v;
      render();
    });
  });
  [['f-tempo','tempo'],['f-pian','pian'],['f-stagione','stagione'],['f-avanzi','avanzi'],['f-freezer','freezer'],['f-grad','grad'],['f-attrezz','attrezz']].forEach(([id,key])=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', e=>{ state.filters[key] = e.target.value; render(); });
  });

  document.querySelectorAll('[data-pantry-view]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      state.pantryView = e.target.dataset.pantryView;
      render();
    });
  });
  document.querySelectorAll('[data-luogo-toggle]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const key = e.currentTarget.dataset.luogoToggle;
      state.pantryLuogoPicker = state.pantryLuogoPicker === key ? null : key;
      render();
    });
  });
  document.querySelectorAll('[data-luogo-picker-close]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.pantryLuogoPicker = null; render(); });
  });
  document.querySelectorAll('[data-luogo-set]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const it = state.pantryItems[e.currentTarget.dataset.luogoSet];
      if(it) it.luogo = e.currentTarget.dataset.luogoValue;
      state.pantryLuogoPicker = null;
      persist(); render();
    });
  });
  document.querySelectorAll('[data-qty-inc]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const it = state.pantryItems[e.currentTarget.dataset.qtyInc];
      if(!it) return;
      it.qty = (typeof it.qty === 'number' ? it.qty : 0) + 1;
      persist(); render();
    });
  });
  document.querySelectorAll('[data-qty-dec]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const it = state.pantryItems[e.currentTarget.dataset.qtyDec];
      if(!it) return;
      it.qty = Math.max(0, (typeof it.qty === 'number' ? it.qty : 0) - 1);
      persist(); render();
    });
  });
  document.querySelectorAll('[data-qty-show]').forEach(el=>{
    el.addEventListener('click', e=>{
      state.pantryEditingKey = e.currentTarget.dataset.qtyShow;
      render();
    });
  });
  const qtyEditInput = document.querySelector('[data-qty-edit]');
  if(qtyEditInput){
    qtyEditInput.focus();
    qtyEditInput.select();
    const commitQtyEdit = ()=>{
      const it = state.pantryItems[qtyEditInput.dataset.qtyEdit];
      if(it){
        const n = parseInt(qtyEditInput.value, 10);
        it.qty = Number.isNaN(n) ? 0 : Math.max(0, n);
      }
      state.pantryEditingKey = null;
      persist(); render();
    };
    qtyEditInput.addEventListener('blur', commitQtyEdit);
    qtyEditInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') qtyEditInput.blur(); });
  }
  document.querySelectorAll('[data-inv-remove]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      delete state.pantryItems[e.currentTarget.dataset.invRemove];
      persist(); render();
    });
  });
  const invAddBtn = document.getElementById('inv-add-btn');
  if(invAddBtn){
    const nameInput = document.getElementById('inv-add-name');
    const luogoSelect = document.getElementById('inv-add-luogo');
    const doAdd = ()=>{
      if(!nameInput.value.trim()) return;
      upsertPantryItem(nameInput.value, luogoSelect.value);
      persist(); render();
    };
    invAddBtn.addEventListener('click', doAdd);
    nameInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') doAdd(); });
  }
}

(async function init(){
  await firebaseReady;
  await waitForAuth();
  await loadState();
  if(DATA.forcedWeekBaseline && state.appliedForcedWeekVersion !== DATA.forcedWeekVersion){
    state.weekBaseline = DATA.forcedWeekBaseline;
    state.weekOverrides = {};
    state.appliedForcedWeekVersion = DATA.forcedWeekVersion;
    persist();
  }
  // Una tantum: porta gli elementi del vecchio elenco statico (DATA.pantry)
  // nell'inventario editabile, così la Dispensa parte già popolata invece
  // che vuota. Il flag evita di rimetterceli se poi vengono rimossi a mano.
  if(!state.pantrySeeded){
    DATA.pantry.forEach(p=> upsertPantryItem(p.elemento, ''));
    state.pantrySeeded = true;
    persist();
  }
  // Una tantum: porta il contenuto dei vecchi 3 cassetti fissi del freezer
  // nell'inventario unico, con luogo "freezer" (porzioni/data/note testuali
  // non hanno più posto nel nuovo modello a quantità numerica).
  if(!state.freezerSeeded){
    if(state.freezer){
      Object.values(state.freezer).forEach(d=>{
        if(d && d.contenuto && d.contenuto.trim()) upsertPantryItem(d.contenuto, 'freezer');
      });
    }
    state.freezerSeeded = true;
    persist();
  }
  // Una tantum: passa dalla vecchia quantità testuale libera (es. "6-8
  // medie") al nuovo contatore numerico con stepper. Non essendoci un modo
  // sensato di convertire un testo descrittivo in un numero, le voci
  // esistenti partono da 1 (l'utente aggiusta col +/-) invece di sparire.
  // Include anche le vecchie voci del freezer (state.freezerItems, dalla
  // migrazione precedente), che confluiscono qui con luogo "freezer".
  if(!state.pantryQtyMigrated){
    Object.keys(state.pantryItems).forEach(key=>{
      const it = state.pantryItems[key];
      if(it && typeof it.qty !== 'number'){
        state.pantryItems[key] = { nome: it.nome, qty: 1, luogo: it.luogo || 'dispensa' };
      }
    });
    if(state.freezerItems){
      Object.values(state.freezerItems).forEach(it=>{
        if(it && it.nome) upsertPantryItem(it.nome, 'freezer');
      });
    }
    state.pantryQtyMigrated = true;
    persist();
  }
  render();
})();

(function(){
  const btn = document.getElementById('refresh-btn');
  if(!btn) return;
  btn.addEventListener('click', async ()=>{
    btn.disabled = true;
    btn.textContent = '↻ Aggiornamento…';
    try{
      if(window.caches && caches.keys){
        const keys = await caches.keys();
        await Promise.all(keys.map(k=>caches.delete(k)));
      }
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      // Su iOS, aperta da "Aggiungi a Home", una normale navigazione (anche con
      // URL diverso) può comunque restituire una copia in cache del sistema.
      // Un fetch con cache:'no-store' bypassa sempre la rete, senza eccezioni;
      // riscriviamo poi il documento a mano col markup appena scaricato.
      const res = await fetch(window.location.pathname + '?_refresh=' + Date.now(), { cache: 'no-store' });
      if(!res.ok) throw new Error('fetch failed: ' + res.status);
      const html = await res.text();
      document.open();
      document.write(html);
      document.close();
      return;
    }catch(e){ /* ignora: procedi col fallback sotto */ }
    // Cambia l'URL così il browser non può servire la pagina dalla cache HTTP.
    const url = new URL(window.location.href);
    url.searchParams.set('_refresh', Date.now().toString());
    window.location.replace(url.toString());
  });
})();
</script>
</body>
</html>
