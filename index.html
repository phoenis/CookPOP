<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CookPOP">
<meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)">
<!--<meta name="theme-color" content="#18191b" media="(prefers-color-scheme: dark)">-->
<title>CookPOP</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<div id="login-gate">
  <div class="login-box">
    <h2>CookPOP</h2>
    <p class="login-sub">Accedi per continuare</p>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username">
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-submit" type="button" class="btn is-solid is-block">Accedi</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>
<header class="topbar">
  <div class="topbar-inner">
    <span class="topbar-title" id="topbar-title">CookPOP</span>
    <button class="btn-settings" id="settings-btn" type="button" aria-label="Impostazioni"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--ph" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 256 256"><path fill="currentColor" d="M112 60a16 16 0 1 1 16 16a16 16 0 0 1-16-16m16 52a16 16 0 1 0 16 16a16 16 0 0 0-16-16m0 68a16 16 0 1 0 16 16a16 16 0 0 0-16-16"></path></svg></button>
  </div>
</header>
<div class="app">
  <main class="panel" id="panel"></main>
</div>
<nav class="tabs">
  <button data-tab="menu" class="active"><span class="bn-icon"><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="100%" height="100%" viewBox="0 0 256 256">
  <path fill="currentColor" d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16M72 48v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24v32H48V48Zm136 160H48V96h160z"></path>
  <text class="cal-day-num" x="128" y="188" text-anchor="middle" font-size="100" font-weight="900" fill="currentColor" font-family="system-ui, sans-serif">1</text>
</svg></span><span class="bn-label">Menù</span></button>
  <button data-tab="spesa"><span class="bn-icon"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--tabler" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0m11 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0"></path><path d="M17 17H6V3H4"></path><path d="m6 5l14 1l-1 7H6"></path></g></svg></span><span class="bn-label">Spesa</span></button>
  <button data-tab="prep"><span class="bn-icon"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--tabler" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3c1.918 0 3.52 1.35 3.91 3.151A4 4 0 0 1 18 13.874V21H6v-7.126a4 4 0 1 1 2.092-7.723A4 4 0 0 1 12 3M6.161 17.009L18 17"></path></svg></span><span class="bn-label">Ricette</span></button>
  <button data-tab="dispensa"><span class="bn-icon"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--ph" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" viewBox="0 0 256 256"><path fill="currentColor" d="M220 151.67V216a12 12 0 0 1-12 12H48a12 12 0 0 1-12-12v-64.33a12 12 0 1 1 24 0v52.23h136v-52.23a12 12 0 1 1 24 0M88 183.81h80a12.06 12.06 0 0 0 0-24.11H88a12.06 12.06 0 0 0 0 24.11M96.2 113l75.17 27.49a12.05 12.05 0 0 0 8.21-22.66l-75.17-27.48A12 12 0 0 0 96.2 113M128 49.29l61.29 51.64a12 12 0 0 0 16.9-1.48a12.09 12.09 0 0 0-1.48-17l-61.27-51.63a12 12 0 0 0-16.91 1.49A12.1 12.1 0 0 0 128 49.29"></path></svg></span><span class="bn-label">Dispensa</span></button>
</nav>
<div class="settings-backdrop" id="settings-backdrop">
  <div class="settings-sheet filters-modal">
    <div class="filters-modal-header">
      <h3>Impostazioni</h3>
      <button class="btn is-icon filters-close-btn" id="settings-close">✕</button>
    </div>
    <div id="profile-panel"></div>
    <button class="btn is-outline settings-item" id="refresh-btn" type="button" title="Ricarica la pagina scaricando l'ultima versione, ignorando la cache del browser">↻ Aggiorna app</button>
    <button class="btn is-outline settings-item settings-item-danger" id="logout-btn" type="button" style="display:none;">⏻ Esci</button>
    <p class="settings-credit">AGGIORNATO A MANO, CUCINATO CON CURA</p>
  </div>
</div>

<script>
  document.querySelectorAll('.cal-day-num').forEach(el => {
  el.textContent = new Date().getDate();
});
</script>
<script src="app.js?v=17"></script>
</body>
</html>
