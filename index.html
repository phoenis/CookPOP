<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quaderno Cucina">
<title>Quaderno della Cucina — Mara & Ste</title>
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#223526; --green-mid:#324a34; --paper:#f5efe1; --paper-2:#ece3cf;
    --gold:#d4a73a; --gold-dark:#a97f22; --tomato:#b33a3a; --steel:#3b6f8f;
    --amber:#c98a2e; --plum:#7a5a8a; --ink:#2a2420; --sage:#7c8b6f; --line: rgba(42,36,32,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--green-deep);
    background-image:radial-gradient(circle at 15% 10%, rgba(212,167,58,0.08), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(179,58,58,0.08), transparent 45%);
    color:var(--ink); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--green-deep); }
  .app{ max-width:960px; margin:0 auto; padding:20px 16px 80px; }
  header.top{ padding:28px 4px 20px; color:var(--paper); text-align:center; }
  header.top .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  header.top h1{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(28px,5vw,42px); margin:0 0 6px; letter-spacing:-0.01em; }
  header.top p{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; color:var(--paper-2); opacity:0.85; margin:0; font-size:15px; }
  nav.tabs{ display:flex; gap:6px; background:var(--green-mid); padding:6px; border-radius:14px; margin-bottom:18px; position:sticky; top:10px; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,0.25); }
  nav.tabs button{ flex:1; background:transparent; border:none; color:var(--paper-2); font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:0.04em; padding:11px 6px; border-radius:9px; cursor:pointer; transition:background .15s ease, color .15s ease; }
  nav.tabs button:hover{ background:rgba(245,239,225,0.08); }
  nav.tabs button.active{ background:var(--gold); color:var(--green-deep); font-weight:600; }
  nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .panel{ background:var(--paper); border-radius:16px; padding:22px 20px 26px; box-shadow:0 14px 40px rgba(0,0,0,0.28); }
  h2.section-title{ font-family:'Fraunces', serif; font-weight:700; font-size:22px; margin:0 0 4px; color:var(--green-deep); }
  p.section-sub{ font-size:13px; color:var(--sage); margin:0 0 16px; }

  /* balance strip */
  .balance-strip{ display:flex; gap:6px; margin-bottom:18px; overflow-x:auto; padding-bottom:2px; }
  .balance-chip{ flex:1; min-width:52px; text-align:center; border-radius:10px; padding:8px 4px 7px; background:rgba(124,139,111,0.14); border:1px solid var(--line); }
  .balance-chip .bd{ font-family:'JetBrains Mono', monospace; font-size:9.5px; color:var(--sage); text-transform:uppercase; }
  .balance-chip .bc{ font-size:18px; margin-top:3px; line-height:1; }

  .day-card{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; background:#fffdf8; }
  .day-row{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .day-name{ font-family:'Fraunces', serif; font-weight:700; font-size:16px; color:var(--green-deep); min-width:90px; }
  .day-time{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--ink); opacity:0.75; background:rgba(42,36,32,0.08); padding:2px 8px; border-radius:20px; }
  .day-menu-row{ display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .day-menu{ font-size:14.5px; font-weight:600; cursor:pointer; color:var(--green-deep); border-bottom:1px dotted var(--sage); }
  .day-menu:hover{ color:var(--gold-dark); }
  .day-meta{ font-size:12.5px; color:var(--sage); margin-top:4px; line-height:1.5; }
  .day-meta b{ color:var(--ink); font-weight:600; }
  .soak-chip{ display:inline-block; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--steel); background:rgba(59,111,143,0.1); padding:3px 8px; border-radius:20px; margin-top:6px; }
  .swap-select{ margin-top:10px; width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); }

  .swap-controls{ display:flex; gap:8px; margin-top:10px; }
  .swap-panel{ margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:10px; background:rgba(124,139,111,0.06); }
  .swap-search{ width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:#fff; margin-bottom:8px; }
  .swap-cat-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip-btn{ font-family:'JetBrains Mono', monospace; font-size:11px; padding:5px 10px; border-radius:20px; border:1px solid var(--line); background:#fff; color:var(--sage); cursor:pointer; }
  .chip-btn.active{ background:var(--gold); border-color:var(--gold); color:var(--green-deep); font-weight:600; }
  .swap-results{ max-height:240px; overflow-y:auto; border-top:1px solid var(--line); }
  .swap-result{ display:flex; align-items:center; gap:8px; padding:8px 4px; border-bottom:1px dashed var(--line); cursor:pointer; font-size:13px; }
  .swap-result:last-child{ border-bottom:none; }
  .swap-result:hover{ background:rgba(212,167,58,0.12); }
  .swap-result-icon{ font-size:15px; flex-shrink:0; }
  .swap-result-name{ flex:1; font-weight:600; }
  .swap-result-time{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--sage); flex-shrink:0; }

  .detail-box{ margin-top:10px; padding:12px; background:rgba(124,139,111,0.08); border-radius:10px; border:1px solid var(--line); }
  .detail-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
  .ing-list{ list-style:none; padding:0; margin:0; }
  .ing-empty{ font-size:12px; color:var(--sage); font-style:italic; margin-bottom:8px; }
  .detail-section{ padding-top:10px; margin-top:10px; border-top:1px solid var(--line); }
  .detail-section:first-child{ padding-top:0; margin-top:0; border-top:none; }
  .detail-section-title{ font-family:'JetBrains Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold-dark); margin-bottom:6px; }
  .note-box{ background:rgba(212,167,58,0.09); border:1px solid rgba(212,167,58,0.25); border-radius:8px; padding:8px 10px; border-top:1px solid rgba(212,167,58,0.25); }
  .detail-extra-note{ font-size:12.5px; color:var(--ink); margin-bottom:4px; line-height:1.4; }
  .detail-extra-note:last-child{ margin-bottom:0; }
  .steps-list{ margin:0; padding-left:18px; font-size:12.5px; line-height:1.6; }
  .steps-list li{ margin-bottom:3px; }
  .ing-list li{ font-size:12.5px; padding:3px 0; border-bottom:1px dashed var(--line); display:flex; justify-content:space-between; gap:8px; }
  .ing-list li:last-child{ border-bottom:none; }
  .full-badge{ font-size:12px; }
  .source-link{ font-size:12px; color:var(--steel); text-decoration:none; font-weight:600; }
  .source-link:hover{ text-decoration:underline; }
  .add-ing-form{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; }
  .add-ing-form input{ font-family:'Inter',sans-serif; font-size:12.5px; padding:6px 8px; border-radius:7px; border:1px solid var(--line); }
  .add-ing-form button{ grid-column:1 / -1; font-family:'JetBrains Mono', monospace; font-size:11.5px; background:var(--green-mid); color:#fff; border:none; padding:7px; border-radius:7px; cursor:pointer; }
  .add-ing-form button:hover{ background:var(--green-deep); }

  .shop-day-group{ margin-bottom:16px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fffdf8; }
  .shop-day-title{ font-family:'Fraunces', serif; font-weight:700; font-size:14.5px; color:var(--green-deep); margin-bottom:6px; }
  .shop-day-title .d{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--sage); font-weight:400; margin-right:6px; }
  .dept-block{ margin-top:8px; }
  .dept-block:first-child{ margin-top:0; }
  .dept-title{ display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold-dark); padding:6px 0 4px; border-bottom:1px solid var(--line); margin-bottom:2px; }
  .dept-icon{ font-size:14px; }
  .shop-item{ display:flex; align-items:flex-start; gap:10px; padding:7px 2px; border-bottom:1px dashed var(--line); font-size:13.5px; }
  .shop-item:last-of-type{ border-bottom:none; }
  .shop-item input[type=checkbox]{ margin-top:3px; width:16px;height:16px; accent-color:var(--tomato); flex-shrink:0; }
  .shop-item.checked .item-name{ text-decoration:line-through; opacity:0.45; }
  .item-name{ font-weight:600; }
  .item-detail{ display:block; font-size:11.5px; color:var(--sage); margin-top:1px; }
  .shop-progress{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--gold-dark); margin-bottom:12px; }
  .missing-ing-banner{ font-size:12.5px; line-height:1.5; background:rgba(179,58,58,0.08); border:1px solid rgba(179,58,58,0.25); color:var(--ink); border-radius:8px; padding:10px 12px; margin-bottom:14px; }
  .staples-block{ margin-top:20px; padding-top:16px; border-top:1px dashed var(--line); }
  .staples-title{ font-family:'Fraunces', serif; font-weight:700; font-size:15px; color:var(--green-deep); margin-bottom:2px; }
  .staples-hint{ font-size:11.5px; color:var(--sage); margin:0 0 8px; }
  .view-toggle{ display:flex; gap:6px; margin-bottom:12px; }
  .view-btn{ flex:1; font-family:'JetBrains Mono', monospace; font-size:11.5px; padding:8px 6px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--sage); cursor:pointer; }
  .view-btn.active{ background:var(--green-mid); color:#fff; border-color:var(--green-mid); }
  .reset-btn{ font-family:'JetBrains Mono', monospace; font-size:11px; background:none; border:1px solid var(--line); color:var(--sage); padding:6px 10px; border-radius:8px; cursor:pointer; margin-bottom:16px; }
  .reset-btn:hover{ border-color:var(--tomato); color:var(--tomato); }
  .mini-add-btn{ font-family:'JetBrains Mono', monospace; font-size:11px; background:none; border:1px dashed var(--sage); color:var(--sage); padding:5px 9px; border-radius:7px; cursor:pointer; margin-top:4px; }
  .mini-add-btn:hover{ border-color:var(--gold-dark); color:var(--gold-dark); }

  .filters{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .filters select, .filters input[type=search]{ font-family:'Inter',sans-serif; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  .filters input[type=search]{ flex:1; min-width:140px; }
  .filters-open-btn{ display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono', monospace; font-size:12.5px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--green-mid); cursor:pointer; white-space:nowrap; }
  .filters-open-btn:hover{ border-color:var(--gold-dark); color:var(--gold-dark); }
  .filters-modal-backdrop{ position:fixed; inset:0; background:rgba(34,53,38,0.55); z-index:200; display:flex; align-items:flex-end; justify-content:center; }
  .filters-modal{ background:var(--paper); width:100%; max-width:520px; max-height:82vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px 18px 14px; box-shadow:0 -10px 40px rgba(0,0,0,0.3); }
  .filters-modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .filters-modal-header h3{ font-family:'Fraunces', serif; font-weight:700; font-size:19px; margin:0; color:var(--green-deep); }
  .filters-close-btn{ background:none; border:none; font-size:18px; color:var(--sage); cursor:pointer; padding:4px 8px; }
  .filters-close-btn:hover{ color:var(--tomato); }
  .filters-modal-footer{ display:flex; gap:8px; margin-top:14px; }
  .filters-modal-footer .reset-btn{ margin-bottom:0; flex:1; }
  .filters-modal-footer .mini-add-btn{ margin-top:0; flex:1; text-align:center; background:var(--gold); border-color:var(--gold); color:var(--green-deep); font-weight:600; }
  .filter-groups{ display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
  .filter-group-label{ font-family:'JetBrains Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--sage); margin-bottom:6px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .filter-group select{ width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  .recipe-count{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--sage); margin-bottom:10px; }
  .recipe-list{ display:grid; grid-template-columns:1fr; gap:8px; }
  .recipe-card{ border:1px solid var(--line); background:#fffdf8; border-radius:10px; padding:11px 13px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; }
  .recipe-card:hover{ border-color:var(--gold-dark); }
  .recipe-card-wrap{ margin-bottom:0; }
  .recipe-name{ font-weight:600; font-size:14px; }
  .recipe-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .tag{ font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:2px 7px; border-radius:20px; background:rgba(124,139,111,0.15); color:var(--green-mid); white-space:nowrap; }
  .tag.season{ background:rgba(212,167,58,0.18); color:var(--gold-dark); }
  .tag.freezer{ background:rgba(59,111,143,0.14); color:var(--steel); }
  .tag.tempo{ background:rgba(42,36,32,0.08); color:var(--ink); opacity:0.75; }
  .heart{ font-size:18px; flex-shrink:0; }
  .cat-icon{ font-size:20px; flex-shrink:0; }
  .recipe-card-side{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex-shrink:0; }
  .recipe-time{ font-size:15px; line-height:1; cursor:help; }
  .recipe-list{ display:grid; grid-template-columns:1fr; gap:8px; }
  .recipe-list .recipe-card-wrap .detail-box{ margin-top:-2px; margin-bottom:0; border-top-left-radius:0; border-top-right-radius:0; }

  .inv-item{ display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px dashed var(--line); position:relative; }
  .inv-item .inv-name{ flex:1; font-size:13.5px; }
  .inv-luogo{ flex-shrink:0; width:26px; height:26px; border-radius:50%; border:none; background:transparent; font-size:13px; line-height:1; cursor:pointer; }
  .inv-luogo:hover{ opacity:0.65; }
  .luogo-picker-backdrop{ position:fixed; inset:0; z-index:150; background:transparent; }
  .luogo-picker{ position:absolute; top:100%; left:0; margin-top:4px; z-index:151; display:flex; gap:2px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:5px; box-shadow:0 6px 18px rgba(34,53,38,0.22); }
  .luogo-picker-opt{ width:30px; height:30px; flex-shrink:0; border-radius:50%; border:none; background:transparent; font-size:15px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .luogo-picker-opt:hover{ background:rgba(124,139,111,0.14); }
  .luogo-picker-opt.active{ background:var(--gold); }
  .qty-stepper{ flex-shrink:0; display:flex; align-items:center; gap:4px; }
  .qty-btn{ width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--green-deep); font-size:14px; line-height:1; cursor:pointer; }
  .qty-btn:hover{ background:rgba(124,139,111,0.14); }
  .qty-num{ display:inline-block; min-width:22px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:600; color:var(--ink); cursor:text; }
  .qty-input{ width:44px; font-family:'JetBrains Mono', monospace; font-size:13px; text-align:center; padding:3px 2px; border-radius:6px; border:1px solid var(--gold); background:#fff; color:var(--ink); -moz-appearance:textfield; appearance:textfield; }
  .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .inv-remove{ flex-shrink:0; width:26px; height:26px; border-radius:50%; border:none; background:transparent; color:var(--tomato); display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .inv-remove svg{ width:16px; height:16px; }
  .inv-remove:hover{ opacity:0.7; }
  .inv-add-row{ display:flex; gap:6px; margin-top:12px; }
  .inv-add-row input, .inv-add-row select{ font-family:'Inter',sans-serif; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  .inv-add-row input#inv-add-name{ flex:1; min-width:0; }
  .inv-add-row select#inv-add-luogo{ flex-shrink:0; max-width:130px; }
  .inv-add-row button{ flex-shrink:0; font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; padding:8px 12px; border-radius:8px; border:none; background:var(--green-mid); color:#fff; cursor:pointer; }
  .inv-add-row button:hover{ background:var(--green-deep); }
  .save-hint{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--sage); text-align:right; min-height:14px; }
  footer.credit{ text-align:center; color:rgba(245,239,225,0.35); font-family:'JetBrains Mono', monospace; font-size:10.5px; margin-top:28px; letter-spacing:0.05em; }
  .refresh-btn{ display:block; margin:12px auto 0; font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.05em; color:var(--paper-2); background:rgba(245,239,225,0.08); border:1px solid rgba(245,239,225,0.2); padding:6px 14px; border-radius:20px; cursor:pointer; }
  .refresh-btn:hover{ background:rgba(245,239,225,0.18); }
  .refresh-btn:disabled{ opacity:0.5; cursor:default; }
  .generate-week-block{ margin-top:20px; padding-top:18px; border-top:1px solid var(--line); text-align:center; }
  .generate-week-btn{ display:inline-flex; align-items:center; gap:8px; font-family:'Inter', sans-serif; font-weight:600; font-size:15px; padding:12px 22px; border-radius:12px; border:none; background:var(--green-mid); color:#fff; cursor:pointer; box-shadow:0 6px 16px rgba(50,74,52,0.3); }
  .generate-week-btn:hover{ background:var(--green-deep); }
  .generate-week-hint{ font-size:11.5px; color:var(--sage); margin:8px 0 0; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  #login-gate{ position:fixed; inset:0; z-index:999; display:none; align-items:center; justify-content:center; background:var(--green-deep); padding:20px; }
  .login-box{ width:100%; max-width:340px; background:var(--paper); border-radius:16px; padding:28px 24px; box-shadow:0 20px 50px rgba(0,0,0,0.35); text-align:center; }
  .login-box h2{ font-family:'Fraunces', serif; font-weight:700; font-size:24px; margin:0 0 4px; color:var(--green-deep); }
  .login-box .login-sub{ font-family:'Fraunces', serif; font-style:italic; color:var(--sage); margin:0 0 20px; font-size:14px; }
  .login-box input{ width:100%; font-family:'Inter', sans-serif; font-size:14px; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink); margin-bottom:10px; }
  .login-box button{ width:100%; font-family:'Inter', sans-serif; font-weight:600; font-size:14.5px; padding:11px; border-radius:9px; border:none; background:var(--gold); color:var(--green-deep); cursor:pointer; margin-top:4px; }
  .login-box button:hover{ background:var(--gold-dark); color:var(--paper); }
  .login-box button:disabled{ opacity:0.6; cursor:default; }
  .login-error{ color:var(--tomato); font-size:12.5px; margin-top:10px; min-height:16px; }
  .logout-btn{ position:absolute; top:14px; right:14px; font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:0.05em; color:var(--paper-2); background:rgba(245,239,225,0.1); border:1px solid rgba(245,239,225,0.25); padding:5px 10px; border-radius:20px; cursor:pointer; display:none; }
  .logout-btn:hover{ background:rgba(245,239,225,0.2); }
</style>
</head>

<div id="login-gate">

ico fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Taglia le melanzane a fette di circa mezzo centimetro.", "Grigliale su una piastra ben calda 2–3 minuti per lato, finché morbide.", "Nel frattempo scalda l'olio con l'aglio in padella, aggiungi la passata, sala e cuoci 10–15 minuti.", "Scola bene la mozzarella e tagliala a fettine o cubetti.", "Adagia le melanzane grigliate nella padella con il sugo.", "Distribuisci la mozzarella sopra, copri con un coperchio e cuoci a fuoco basso finché filante.", "Completa con origano e basilico fresco prima di servire."], "avanzi": "Si conserva in frigo fino a 2 giorni, buona anche riscaldata.", "freezer": "Non indicata, meglio consumarla fresca.", "ricordare": "", "link": "https://www.cookist.it/melanzane-alla-pizzaiola-ricetta/"}, "Risotto zucchine e speck": {"porzioni": "3 porzioni", "tempo": "35–40 minuti", "ingredienti": [{"ingrediente": "Riso Carnaroli", "qta": "240 g"}, {"ingrediente": "Zucchine", "qta": "2"}, {"ingrediente": "Speck a cubetti", "qta": "100 g"}, {"ingrediente": "Cipolla o scalogno", "qta": "1"}, {"ingrediente": "Brodo vegetale", "qta": "circa 700 ml"}, {"ingrediente": "Vino bianco", "qta": "mezzo bicchiere, facoltativo"}, {"ingrediente": "Parmigiano grattugiato", "qta": "50 g"}, {"ingrediente": "Burro", "qta": "20 g"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Lava le zucchine e tagliale a pezzetti piccoli.", "Trita la cipolla e falla rosolare in un filo d'olio.", "Aggiungi lo speck e fallo rosolare un paio di minuti.", "Unisci il riso e tostalo per 1–2 minuti.", "Sfuma con il vino bianco, se lo usi, e lascia evaporare.", "Aggiungi le zucchine, poi il brodo un mestolo alla volta, mescolando fino a cottura del riso (circa 16–18 minuti).", "A fuoco spento manteca con burro e parmigiano, aggiusta di sale e pepe.", "Servi con una macinata di pepe."], "avanzi": "Meglio fresco, il risotto perde cremosità se riscaldato.", "freezer": "Non adatto.", "ricordare": "", "link": "https://www.cookaround.com/ricetta/Risotto-zucchine-e-speck.html"}, "Pasta al pesto": {"porzioni": "3 porzioni", "tempo": "20–25 minuti", "ingredienti": [{"ingrediente": "Pasta (trofie o trenette)", "qta": "240 g"}, {"ingrediente": "Basilico fresco", "qta": "40 g"}, {"ingrediente": "Pinoli", "qta": "20 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "30 g"}, {"ingrediente": "Pecorino grattugiato", "qta": "20 g"}, {"ingrediente": "Aglio", "qta": "1/2 spicchio"}, {"ingrediente": "Olio EVO", "qta": "circa 80 ml"}, {"ingrediente": "Sale grosso", "qta": "q.b."}], "procedimento": ["Lava e asciuga delicatamente le foglie di basilico, senza lasciarle a bagno.", "Frulla (o pesta nel mortaio) l'aglio con un pizzico di sale grosso.", "Aggiungi i pinoli e le foglie di basilico poco alla volta.", "Unisci i formaggi e infine l'olio a filo, fino a ottenere una crema omogenea.", "Cuoci la pasta in acqua bollente salata.", "Scola la pasta tenendo da parte un po' di acqua di cottura.", "Manteca la pasta con il pesto fuori dal fuoco, allungando con acqua di cottura se serve."], "avanzi": "Meglio fresca, il pesto tende a scurirsi.", "freezer": "Il pesto (senza pasta) si può congelare in vasetti.", "ricordare": "", "link": "https://www.eataly.net/it_it/magazine/ricette/pasta-al-pesto"}, "Pasta a cacio e pepe": {"porzioni": "3 porzioni", "tempo": "15–20 minuti", "ingredienti": [{"ingrediente": "Pasta (tonnarelli o spaghetti)", "qta": "240 g"}, {"ingrediente": "Pecorino romano grattugiato", "qta": "150 g"}, {"ingrediente": "Pepe nero in grani", "qta": "q.b., abbondante"}], "procedimento": ["Pesta i grani di pepe nel mortaio (o macinali grossolanamente).", "Tostali un minuto in una padella ampia e larga, poi spegni.", "Cuoci la pasta in acqua bollente poco salata (il pecorino è già sapido).", "Metti il pecorino in una ciotola con un mestolo di acqua di cottura, mescola fino a una crema pastosa senza grumi.", "Circa 2 minuti prima che la pasta sia pronta, scola conservando l'acqua di cottura e trasferiscila nella padella col pepe.", "Aggiungi un mestolo di acqua di cottura e manteca a fuoco basso.", "Spegni il fuoco e unisci la crema di pecorino, mescolando energicamente fino a renderla vellutata."], "avanzi": "Meglio fresca, la crema di formaggio tende a rapprendersi se riscaldata.", "freezer": "Non adatta.", "ricordare": "", "link": "https://www.cookist.it/spaghetti-cacio-e-pepe-ricetta/"}, "Pasta e fagioli": {"porzioni": "3 porzioni", "tempo": "35–40 minuti (con fagioli già cotti)", "ingredienti": [{"ingrediente": "Fagioli borlotti o cannellini già cotti", "qta": "400 g"}, {"ingrediente": "Pasta corta (ditalini o mista)", "qta": "150 g"}, {"ingrediente": "Passata di pomodoro o concentrato", "qta": "2 cucchiai di concentrato o 200 g passata"}, {"ingrediente": "Cipolla", "qta": "1/2"}, {"ingrediente": "Sedano e carota", "qta": "facoltativi, 1 gambo e 1 pezzo"}, {"ingrediente": "Rosmarino o alloro", "qta": "q.b."}, {"ingrediente": "Brodo vegetale o acqua calda", "qta": "circa 700 ml"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Trita cipolla (e sedano e carota se li usi) e falli soffriggere in un filo d'olio con il rosmarino.", "Aggiungi i fagioli, tenendone da parte una parte da frullare a crema con un po' di brodo.", "Unisci la crema di fagioli frullata e il concentrato o la passata.", "Versa il brodo caldo, porta a bollore e aggiungi la pasta.", "Cuoci fino a cottura della pasta, mescolando ogni tanto e aggiungendo brodo se si asciuga troppo.", "Regola di sale e pepe, lascia riposare qualche minuto coperta prima di servire con un filo d'olio a crudo."], "avanzi": "Ottima anche il giorno dopo, spesso migliora di sapore.", "freezer": "Si può congelare, meglio senza la pasta (aggiungerla fresca al momento di servire).", "ricordare": "", "link": "https://www.cookist.it/pasta-e-fagioli-ricetta/"}, "Trancio di salmone al forno": {"porzioni": "3 porzioni", "tempo": "25–30 minuti", "ingredienti": [{"ingrediente": "Tranci di salmone", "qta": "3 (circa 180 g l'uno)"}, {"ingrediente": "Limone", "qta": "1"}, {"ingrediente": "Prezzemolo fresco", "qta": "q.b."}, {"ingrediente": "Aglio", "qta": "1 spicchio, facoltativo"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Prepara un'emulsione con olio, succo di limone, prezzemolo tritato, sale e pepe.", "Disponi i tranci di salmone in una teglia foderata con carta forno.", "Spennella generosamente i tranci con l'emulsione.", "Cuoci in forno preriscaldato a 190°C per 15–18 minuti, a seconda dello spessore.", "Sforna e completa con altro prezzemolo fresco e una spruzzata di limone."], "avanzi": "Meglio fresco, il pesce cotto perde consistenza se riscaldato.", "freezer": "Non adatto.", "ricordare": "", "link": "https://www.fattoincasadabenedetta.it/ricetta/salmone-al-forno/"}, "Gnocchi alla sorrentina": {"porzioni": "3 porzioni", "tempo": "35–40 minuti", "ingredienti": [{"ingrediente": "Gnocchi di patate (anche confezionati)", "qta": "600 g"}, {"ingrediente": "Passata di pomodoro", "qta": "400 g"}, {"ingrediente": "Mozzarella fiordilatte", "qta": "200 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "50 g"}, {"ingrediente": "Aglio", "qta": "1 spicchio"}, {"ingrediente": "Basilico fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale", "qta": "q.b."}], "procedimento": ["Scola bene la mozzarella e tagliala a dadini, lasciandola sgocciolare.", "Scalda l'olio con l'aglio in una padella, aggiungi la passata, sala e cuoci 15–20 minuti.", "Cuoci gli gnocchi in acqua bollente salata finché vengono a galla.", "Scolali e versali direttamente nella padella col sugo, mescolando delicatamente.", "Trasferisci in una teglia da forno, distribuisci mozzarella e parmigiano.", "Gratina in forno già caldo a 200°C per 5–10 minuti, finché la mozzarella è filante e dorata.", "Guarnisci con basilico fresco e servi subito."], "avanzi": "Buona anche il giorno dopo, riscaldata in forno o padella.", "freezer": "Non indicata, il formaggio filante non rende bene una volta scongelato.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/gnocchi-alla-sorrentina/"}, "Zucchine gratinate al forno": {"porzioni": "3 porzioni", "tempo": "30–35 minuti", "ingredienti": [{"ingrediente": "Zucchine", "qta": "5–6"}, {"ingrediente": "Pangrattato", "qta": "80 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "40 g"}, {"ingrediente": "Aglio", "qta": "1 spicchio"}, {"ingrediente": "Prezzemolo fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Lava le zucchine, elimina le estremità e affettale sottili (2–3 mm), meglio con una mandolina.", "Frulla o trita finemente olio, prezzemolo e aglio per ottenere un olio aromatico.", "Mescola pangrattato e parmigiano con l'olio aromatico, sale e pepe.", "Disponi le fette di zucchine in una teglia foderata, condiscile con la panatura.", "Cuoci in forno già caldo a 200°C per 15–20 minuti, finché dorate e croccanti in superficie."], "avanzi": "Si conservano un paio di giorni in frigo, buone anche a temperatura ambiente.", "freezer": "Non indicata.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/zucchine-gratinate-al-forno/"}, "Risotto alla milanese": {"porzioni": "3 porzioni", "tempo": "35–40 minuti (con brodo già pronto)", "ingredienti": [{"ingrediente": "Riso Carnaroli o Vialone Nano", "qta": "240 g"}, {"ingrediente": "Zafferano in pistilli o bustine", "qta": "1 bustina o una presa di pistilli"}, {"ingrediente": "Cipolla", "qta": "1/2"}, {"ingrediente": "Brodo di carne o vegetale", "qta": "circa 700 ml"}, {"ingrediente": "Vino bianco", "qta": "mezzo bicchiere, facoltativo"}, {"ingrediente": "Burro", "qta": "50 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "50 g"}, {"ingrediente": "Sale", "qta": "q.b."}], "procedimento": ["Scalda il brodo e tienilo caldo sul fuoco.", "Stempera lo zafferano in un mestolo di brodo caldo e lascialo in infusione.", "Trita la cipolla e falla appassire a fuoco basso in metà del burro.", "Aggiungi il riso e tostalo 2-3 minuti.", "Sfuma con il vino bianco, se lo usi, e lascia evaporare.", "Aggiungi il brodo un mestolo alla volta, mescolando, per circa 16-18 minuti.", "A metà cottura unisci il brodo con lo zafferano.", "A fuoco spento manteca con il burro rimasto e il parmigiano, mescolando energicamente.", "Lascia riposare un minuto coperto e servi."], "avanzi": "Meglio fresco, si consiglia di consumarlo appena pronto.", "freezer": "Non adatto.", "ricordare": "", "link": "https://ricette.giallozafferano.it/Risotto-alla-milanese.html"}, "Parmigiana di melanzane": {"porzioni": "4 porzioni", "tempo": "1 ora e 30 minuti", "ingredienti": [{"ingrediente": "Melanzane", "qta": "3 grandi"}, {"ingrediente": "Passata di pomodoro", "qta": "500 g"}, {"ingrediente": "Mozzarella", "qta": "300 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "80 g"}, {"ingrediente": "Cipolla", "qta": "1/2"}, {"ingrediente": "Basilico fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Olio per friggere", "qta": "abbondante"}, {"ingrediente": "Sale", "qta": "q.b."}], "procedimento": ["Taglia le melanzane a fette di mezzo centimetro nel senso della lunghezza.", "Disponile a strati in uno scolapasta, salandole tra uno strato e l'altro, e lasciale spurgare almeno 1 ora sotto un peso.", "Prepara il sugo: soffriggi la cipolla tritata, aggiungi la passata, sala e cuoci 20 minuti con basilico.", "Sciacqua le melanzane, asciugale e friggile in olio bollente fino a doratura, poi scolale su carta assorbente.", "Taglia la mozzarella a fette e falla sgocciolare bene.", "In una teglia versa un po' di sugo sul fondo, poi uno strato di melanzane, sugo, mozzarella, parmigiano e basilico.", "Ripeti gli strati fino a esaurire gli ingredienti, terminando con sugo e parmigiano.", "Cuoci in forno statico a 200°C per 25–30 minuti.", "Lascia riposare qualche minuto prima di tagliare e servire."], "avanzi": "Ottima anche il giorno dopo, anzi migliora riposando.", "freezer": "Si può congelare già porzionata.", "ricordare": "Far spurgare le melanzane sotto sale almeno 1 ora prima di cucinare.", "link": "https://www.cucchiaio.it/ricetta/ricetta-parmigiana-melanzane/"}, "Pollo alla cacciatora": {"porzioni": "3 porzioni", "tempo": "50–60 minuti", "ingredienti": [{"ingrediente": "Pollo a pezzi (cosce o petto)", "qta": "700 g"}, {"ingrediente": "Cipolla", "qta": "1"}, {"ingrediente": "Sedano e carota", "qta": "1 gambo e 1 pezzo"}, {"ingrediente": "Pomodori pelati", "qta": "400 g"}, {"ingrediente": "Vino bianco", "qta": "mezzo bicchiere"}, {"ingrediente": "Rosmarino", "qta": "q.b."}, {"ingrediente": "Olive nere", "qta": "facoltative, 80 g"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Trita cipolla, sedano e carota.", "Fai rosolare il trito in olio in una padella ampia.", "Aggiungi i pezzi di pollo e rosolali finché dorati su tutti i lati.", "Sfuma con il vino bianco e lascia evaporare.", "Aggiungi i pomodori pelati sminuzzati, il rosmarino e un po' d'acqua per allungare.", "Copri e cuoci a fuoco basso per circa 40 minuti, girando il pollo ogni tanto.", "Se usi le olive, uniscile 5 minuti prima della fine.", "Regola di sale, lascia riposare qualche minuto e servi con prezzemolo tritato."], "avanzi": "Ottimo il giorno dopo, il sapore migliora riposando.", "freezer": "Si può congelare.", "ricordare": "", "link": "https://www.fattoincasadabenedetta.it/ricetta/pollo-alla-cacciatora/"}, "Cotoletta alla milanese": {"porzioni": "3 porzioni", "tempo": "25–30 minuti", "ingredienti": [{"ingrediente": "Fettine di vitello (o lombata)", "qta": "3"}, {"ingrediente": "Uova", "qta": "2"}, {"ingrediente": "Pangrattato", "qta": "150 g"}, {"ingrediente": "Farina", "qta": "facoltativa, q.b."}, {"ingrediente": "Burro", "qta": "80 g"}, {"ingrediente": "Sale", "qta": "q.b."}, {"ingrediente": "Limone", "qta": "per servire"}], "procedimento": ["Elimina il grasso in eccesso dalla carne e battila leggermente per uniformare lo spessore.", "Sbatti le uova in un piatto con un pizzico di sale.", "Passa le fettine (nella farina se la usi), poi nell'uovo sbattuto e infine nel pangrattato, premendo bene.", "Sciogli il burro in una padella ampia finché ben caldo.", "Friggi le cotolette pochi minuti per lato, finché dorate.", "Scolale su carta assorbente, sala leggermente e servi calde con spicchi di limone."], "avanzi": "Meglio fresca, va cotta e mangiata subito.", "freezer": "Non adatta, ma si può congelare cruda già impanata.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/cotoletta-alla-milanese/"}, "Orata/branzino al forno con patate": {"porzioni": "3 porzioni", "tempo": "45–50 minuti", "ingredienti": [{"ingrediente": "Orata o branzino (anche filetti)", "qta": "2 (circa 400 g l'una)"}, {"ingrediente": "Patate", "qta": "600 g"}, {"ingrediente": "Limone", "qta": "1"}, {"ingrediente": "Aglio", "qta": "2 spicchi"}, {"ingrediente": "Rosmarino", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Lava e taglia le patate a fette sottili, mettile in acqua fredda 10 minuti per togliere l'amido in eccesso.", "Scolale, condiscile con olio, sale, pepe e disponile su una teglia foderata.", "Inforna le patate da sole a 200°C per 15 minuti.", "Pulisci il pesce, condiscilo dentro e fuori con sale, pepe, aglio e rosmarino.", "Adagia il pesce sopra le patate, aggiungi fette di limone e un filo d'olio.", "Inforna insieme per altri 20–25 minuti, finché il pesce è cotto e le patate dorate."], "avanzi": "Meglio fresco, il pesce cotto perde consistenza se riscaldato.", "freezer": "Non adatto.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/orata-forno-patate/"}, "Frittata di zucchine e parmigiano": {"porzioni": "3 porzioni", "tempo": "25–30 minuti", "ingredienti": [{"ingrediente": "Uova", "qta": "6"}, {"ingrediente": "Zucchine", "qta": "2"}, {"ingrediente": "Parmigiano grattugiato", "qta": "50 g"}, {"ingrediente": "Cipolla", "qta": "facoltativa, 1/2"}, {"ingrediente": "Prezzemolo fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Taglia le zucchine a rondelle sottili.", "Se la usi, soffriggi la cipolla in olio, poi aggiungi le zucchine e cuoci 8–10 minuti finché morbide.", "Sbatti le uova con parmigiano, prezzemolo, sale e pepe.", "Unisci le zucchine intiepidite al composto di uova.", "Versa tutto in padella con un filo d'olio, copri e cuoci a fuoco basso 8–10 minuti.", "Gira la frittata con l'aiuto di un piatto o un coperchio e cuoci ancora 3–4 minuti dall'altro lato."], "avanzi": "Buona anche fredda il giorno dopo, ottima per il pranzo.", "freezer": "Non indicata.", "ricordare": "", "link": "https://www.ricettealvolo.it/frittata-di-zucchine-ricetta-facile/"}, "Ceci in umido al pomodoro e rosmarino + pane": {"porzioni": "3 porzioni", "tempo": "30–35 minuti (con ceci già cotti)", "ingredienti": [{"ingrediente": "Ceci già cotti (o lessati)", "qta": "500 g"}, {"ingrediente": "Passata di pomodoro", "qta": "300 g"}, {"ingrediente": "Cipolla", "qta": "1/2"}, {"ingrediente": "Aglio", "qta": "1 spicchio"}, {"ingrediente": "Rosmarino", "qta": "1 rametto"}, {"ingrediente": "Alloro", "qta": "1 foglia, facoltativo"}, {"ingrediente": "Brodo vegetale o acqua", "qta": "q.b."}, {"ingrediente": "Pane casereccio", "qta": "per servire"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Trita cipolla e aglio, falli soffriggere in olio con rosmarino e alloro.", "Aggiungi la passata di pomodoro, sala e cuoci 5 minuti.", "Unisci i ceci scolati e un po' di brodo o acqua caldi.", "Copri e cuoci a fuoco basso 15–20 minuti, mescolando ogni tanto.", "Se vuoi una consistenza più cremosa, schiaccia una parte dei ceci con una forchetta.", "Regola di sale e pepe, servi ben caldo con fette di pane tostato."], "avanzi": "Ottimi anche il giorno dopo, il sapore migliora riposando.", "freezer": "Si può congelare.", "ricordare": "Se usi i ceci secchi, metterli in ammollo la sera prima.", "link": "https://blog.giallozafferano.it/allacciateilgrembiule/ricetta-ceci-in-umido/"}, "Caponata siciliana": {"porzioni": "4 porzioni", "tempo": "50–60 minuti", "ingredienti": [{"ingrediente": "Melanzane", "qta": "2 grandi"}, {"ingrediente": "Sedano", "qta": "2 coste"}, {"ingrediente": "Cipolla", "qta": "1"}, {"ingrediente": "Pomodori maturi o pelati", "qta": "300 g"}, {"ingrediente": "Olive verdi", "qta": "80 g"}, {"ingrediente": "Capperi", "qta": "30 g"}, {"ingrediente": "Aceto di vino bianco", "qta": "2 cucchiai"}, {"ingrediente": "Zucchero", "qta": "1 cucchiaio"}, {"ingrediente": "Basilico fresco", "qta": "q.b."}, {"ingrediente": "Olio per friggere", "qta": "abbondante"}, {"ingrediente": "Sale", "qta": "q.b."}], "procedimento": ["Taglia le melanzane a cubetti, cospargile di sale e lasciale spurgare 30 minuti in uno scolapasta.", "Sciacquale, asciugale e friggile in olio bollente fino a doratura, poi scola su carta assorbente.", "Taglia il sedano a listarelle e sbollentalo 5 minuti.", "Affetta la cipolla e falla appassire in un tegame con un filo d'olio.", "Aggiungi i pomodori a pezzi e cuoci 10 minuti.", "Unisci melanzane, sedano, olive e capperi.", "Aggiungi aceto e zucchero, lascia sfumare qualche minuto per l'agrodolce.", "Regola di sale, spegni e lascia raffreddare almeno 1-2 ore prima di servire con basilico fresco."], "avanzi": "Migliora nei giorni successivi, si conserva in frigo fino a una settimana.", "freezer": "Si può congelare.", "ricordare": "Meglio prepararla in anticipo: va servita fredda o a temperatura ambiente.", "link": "https://www.tavolartegusto.it/ricetta/caponata-siciliana/"}, "Saltimbocca alla romana": {"porzioni": "3 porzioni", "tempo": "20–25 minuti", "ingredienti": [{"ingrediente": "Fettine di vitello", "qta": "6 piccole"}, {"ingrediente": "Prosciutto crudo a fette", "qta": "6 fette"}, {"ingrediente": "Salvia fresca", "qta": "6-12 foglie"}, {"ingrediente": "Farina", "qta": "q.b."}, {"ingrediente": "Burro", "qta": "40 g"}, {"ingrediente": "Vino bianco", "qta": "mezzo bicchiere"}, {"ingrediente": "Sale", "qta": "q.b."}], "procedimento": ["Batti leggermente le fettine di vitello con un batticarne.", "Adagia su ciascuna una fetta di prosciutto crudo e una foglia di salvia, fissando con uno stecchino.", "Infarina leggermente solo il lato con il prosciutto.", "Sciogli il burro in una padella ampia.", "Cuoci le fettine dal lato infarinato per circa 2 minuti, poi gira e cuoci ancora 1-2 minuti.", "Sfuma con il vino bianco, lascia restringere il fondo di cottura un minuto.", "Servi subito, irrorando con il fondo di cottura."], "avanzi": "Meglio fresco, la carne sottile perde consistenza se riscaldata.", "freezer": "Non adatto.", "ricordare": "", "link": "https://www.tavolartegusto.it/ricetta/saltimbocca-alla-romana-ricetta-originale/"}, "Torta salata ricotta e spinaci": {"porzioni": "4 porzioni", "tempo": "45–50 minuti", "ingredienti": [{"ingrediente": "Pasta sfoglia", "qta": "1 rotolo"}, {"ingrediente": "Ricotta", "qta": "250 g"}, {"ingrediente": "Spinaci (anche surgelati)", "qta": "300 g"}, {"ingrediente": "Uova", "qta": "2"}, {"ingrediente": "Parmigiano grattugiato", "qta": "50 g"}, {"ingrediente": "Noce moscata", "qta": "facoltativa"}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Lessa o scongela gli spinaci, strizzali bene ed eventualmente tritali.", "In una ciotola mescola ricotta, spinaci, uova, parmigiano, sale e pepe (e noce moscata, se la usi).", "Foderare una tortiera con la pasta sfoglia, bucherellando il fondo con una forchetta.", "Versa il ripieno e livella la zo"}, {"ingrediente": "Concentrato o passata di pomodoro", "qta": "2 cucchiai o 200 g"}, {"ingrediente": "Alloro", "qta": "1 foglia"}, {"ingrediente": "Brodo vegetale o acqua", "qta": "circa 700 ml"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Trita cipolla, sedano e carota, falli soffriggere in olio.", "Aggiungi il concentrato o la passata e fai insaporire un paio di minuti.", "Unisci le lenticchie scolate e l'alloro.", "Versa il brodo caldo, porta a bollore.", "Aggiungi la pasta e cuoci mescolando spesso, aggiungendo liquido se si asciuga troppo.", "Regola di sale e pepe, lascia riposare qualche minuto coperta e servi con un filo d'olio a crudo."], "avanzi": "Ottima anche il giorno dopo, il sapore migliora riposando.", "freezer": "Si può congelare, meglio senza pasta.", "ricordare": "Se usi lenticchie secche, non serve ammollo: bastano 20-30 minuti di cottura.", "link": "https://www.tavolartegusto.it/ricetta/pasta-e-lenticchie/"}, "Fagioli all'uccelletto + pane/salsiccia": {"porzioni": "3 porzioni", "tempo": "25–30 minuti (con fagioli già cotti)", "ingredienti": [{"ingrediente": "Fagioli cannellini già cotti", "qta": "500 g"}, {"ingrediente": "Aglio", "qta": "2 spicchi"}, {"ingrediente": "Salvia fresca", "qta": "qualche foglia"}, {"ingrediente": "Rosmarino", "qta": "facoltativo, un rametto"}, {"ingrediente": "Passata di pomodoro", "qta": "200 g"}, {"ingrediente": "Salsiccia", "qta": "facoltativa, 200 g"}, {"ingrediente": "Pane casereccio", "qta": "per servire"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Fai imbiondire l'aglio in olio con salvia (e rosmarino, se lo usi).", "Se usi la salsiccia, sgranala e falla rosolare a parte, poi uniscila.", "Aggiungi i fagioli scolati e fai insaporire qualche minuto.", "Unisci la passata, sala e pepa.", "Cuoci coperto a fuoco basso 10-15 minuti, mescolando ogni tanto.", "Servi caldo con fette di pane casereccio tostato."], "avanzi": "Buoni anche il giorno dopo.", "freezer": "Si può congelare (senza salsiccia rende meglio).", "ricordare": "", "link": "https://www.cookist.it/fagioli-alluccelletto-la-ricetta/"}, "Uova in purgatorio": {"porzioni": "3 porzioni", "tempo": "20–25 minuti", "ingredienti": [{"ingrediente": "Uova", "qta": "6"}, {"ingrediente": "Passata di pomodoro", "qta": "300 ml"}, {"ingrediente": "Aglio", "qta": "1 spicchio"}, {"ingrediente": "Basilico fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}, {"ingrediente": "Pane per servire", "qta": "q.b."}], "procedimento": ["Scalda l'olio con l'aglio in padella, aggiungi basilico.", "Versa la passata, sala e cuoci a fuoco basso 7-8 minuti.", "Rompi le uova una alla volta direttamente nel sugo, distanziandole.", "Sala e pepa leggermente le uova.", "Copri e cuoci 3-4 minuti finché l'albume è rappreso e il tuorlo ancora morbido.", "Completa con basilico fresco e servi con pane tostato."], "avanzi": "Meglio fresche, il tuorlo continua a cuocere se conservate.", "freezer": "Non adatta.", "ricordare": "", "link": "https://www.dissapore.com/ricette/uova-in-purgatorio/"}, "Frittata di patate": {"porzioni": "3 porzioni", "tempo": "30–35 minuti", "ingredienti": [{"ingrediente": "Uova", "qta": "6"}, {"ingrediente": "Patate", "qta": "3 medie"}, {"ingrediente": "Cipolla", "qta": "facoltativa, 1/2"}, {"ingrediente": "Parmigiano grattugiato", "qta": "facoltativo, 40 g"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Sbuccia le patate e tagliale a cubetti piccoli.", "Rosolale in padella con olio (e cipolla, se la usi) per circa 15 minuti, finché morbide e dorate.", "Sbatti le uova con sale, pepe e parmigiano, se lo usi.", "Unisci le patate tiepide alle uova sbattute.", "Versa il composto in padella con un filo d'olio, copri e cuoci a fuoco basso 8-10 minuti.", "Gira la frittata con l'aiuto 3 (circa 150 g l'uno)"}, {"ingrediente": "Pomodorini", "qta": "250 g"}, {"ingrediente": "Olive nere", "qta": "60 g"}, {"ingrediente": "Capperi", "qta": "20 g"}, {"ingrediente": "Aglio", "qta": "1 spicchio"}, {"ingrediente": "Origano", "qta": "q.b."}, {"ingrediente": "Prezzemolo fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale", "qta": "q.b."}], "procedimento": ["Taglia i pomodorini a metà.", "Scalda l'olio con l'aglio in padella, aggiungi i pomodorini e falli ammorbidire qualche minuto.", "Unisci olive, capperi e origano.", "Adagia i filetti di merluzzo nella padella, sala leggermente.", "Copri e cuoci a fuoco medio 12-15 minuti, finché il pesce è cotto.", "Completa con prezzemolo fresco e servi caldo."], "avanzi": "Meglio fresco.", "freezer": "Non adatto.", "ricordare": "", "link": "https://www.cookist.it/filetti-di-merluzzo-alla-mediterranea/"}, "Risotto ai funghi": {"porzioni": "3 porzioni", "tempo": "35–40 minuti", "ingredienti": [{"ingrediente": "Riso Carnaroli", "qta": "240 g"}, {"ingrediente": "Funghi misti freschi (o champignon)", "qta": "300 g"}, {"ingrediente": "Scalogno o cipolla", "qta": "1"}, {"ingrediente": "Brodo vegetale", "qta": "circa 700 ml"}, {"ingrediente": "Vino bianco", "qta": "mezzo bicchiere, facoltativo"}, {"ingrediente": "Burro", "qta": "30 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "50 g"}, {"ingrediente": "Prezzemolo fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Pulisci i funghi con un panno umido e tagliali a fettine.", "Trita lo scalogno e falla appassire in olio.", "Aggiungi i funghi e cuocili qualche minuto, salando.", "Toglili da parte tenendone qualcuno per guarnire.", "Nella stessa pentola tosta il riso 1-2 minuti, sfuma con il vino se lo usi.", "Aggiungi il brodo un mestolo alla volta, mescolando, per 16-18 minuti.", "A metà cottura riunisci i funghi al riso.", "A fuoco spento manteca con b o, mescola ancora.", "Unisci pangrattato poco alla volta finché l'impasto è modellabile.", "Lascia riposare in frigo 15 minuti.", "Forma le polpette e passale nel pangrattato.", "Friggi in olio caldo finché dorate (oppure cuoci in forno a 180°C per 20-25 minuti)."], "avanzi": "Buone anche il giorno dopo.", "freezer": "Si possono congelare crude.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/polpette-di-tonno-e-ricotta/"}, "Pollo alla valdostana": {"porzioni": "3 porzioni", "tempo": "25–30 minuti", "ingredienti": [{"ingrediente": "Petto di pollo a fettine", "qta": "500 g"}, {"ingrediente": "Prosciutto cotto", "qta": "6 fette"}, {"ingrediente": "Fontina", "qta": "150 g"}, {"ingrediente": "Farina", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Passa le fettine di pollo nella farina.", "Scalda l'olio in padella e rosola il pollo 3-4 minuti per lato, salando.", "Disponi su ogni fettina una fetta di prosciutto cotto e una di fontina.", "Copri con un coperchio e cuoci a fuoco basso finché il formaggio si è sciolto.", "Servi caldo, appena il formaggio è filante."], "avanzi": "Meglio fresco, il formaggio filante non rende bene riscaldato.", "freezer": "Non adatto.", "ricordare": "", "link": "https://www.cookist.it/pollo-alla-valdostana-la-ricetta/"}, "Zucchine ripiene": {"porzioni": "3 porzioni", "tempo": "55–60 minuti", "ingredienti": [{"ingrediente": "Zucchine grandi", "qta": "4-5"}, {"ingrediente": "Carne macinata", "qta": "300 g"}, {"ingrediente": "Uovo", "qta": "1"}, {"ingrediente": "Parmigiano grattugiato", "qta": "40 g"}, {"ingrediente": "Pane raffermo ammollato nel latte", "qta": "1 fetta"}, {"ingrediente": "Pangrattato", "qta": "q.b."}, {"ingrediente": "Prezzemolo fresco", "qta": "q.b."}, {"ingrediente": "Passata di pomodoro", "qta": "facoltativa, 200 g"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Sbollenta le zucchine intere per 5 minuti, poi taglia a metà o in tronchetti e svuota la polpa con un cucchiaino.", "Trita la polpa e uniscila alla carne macinata, uovo, parmigiano, pane strizzato, prezzemolo, sale e pepe.", "Amalgama bene fino a un composto omogeneo.", "Farcisci le zucchine con il ripieno, premendo leggermente.", "Disponile in una teglia, eventualmente con la passata di pomodoro sul fondo.", "Cuoci in forno già caldo a 190°C per 30-35 minuti, finché dorate."], "avanzi": "Buone anche il giorno dopo.", "freezer": "Si possono congelare, sia crude che già cotte.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/zucchine-ripiene-di-carne/"}, "Zuppa di legumi e cereali": {"porzioni": "4 porzioni", "tempo": "45–50 minuti (con legumi già cotti)", "ingredienti": [{"ingrediente": "Legumi misti già cotti (ceci, fagioli, lenticchie)", "qta": "400 g"}, {"ingrediente": "Cereali misti (farro, orzo perlato)", "qta": "150 g"}, {"ingrediente": "Carota, sedano, cipolla", "qta": "1 pezzo ciascuno"}, {"ingrediente": "Pomodori o pelati", "qta": "200 g"}, {"ingrediente": "Rosmarino e alloro", "qta": "q.b."}, {"ingrediente": "Brodo vegetale o acqua", "qta": "circa 1 litro"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Trita carota, sedano e cipolla, falli soffriggere in olio.", "Aggiungi i cereali (se non perlati, sciacquali prima) e fai insaporire un minuto.", "Unisci i pomodori, il rosmarino e l'alloro.", "Versa il brodo caldo, porta a bollore.", "Cuoci a fuoco medio-basso 25-30 minuti, finché i cereali sono teneri.", "Aggiungi i legumi già cotti negli ultimi 10 minuti.", "Regola di sale e pepe, servi con un filo d'olio a crudo."], "avanzi": "Ottima anche il giorno dopo.", "freezer": "Si può congelare.", "ricordare": "", "link": "https://www.ilclubdellericette.it/ricetta/zuppa-di-legumi-e-cereali"}, "Pollo al forno con senape e miele": {"porzioni": "3 porzioni", "tempo": "1 ora (con marinatura)", "ingr "https://www.saporie.com/ricette-degli-chef/secondi-piatti/straccetti-di-manzo-allaceto-balsamico-con-rucola-e-parmigiano-reggiano-dop"}, "Ossobuco alla milanese + risotto allo zafferano": {"porzioni": "3 porzioni", "tempo": "1 ora e 30 minuti", "ingredienti": [{"ingrediente": "Ossibuchi di vitello", "qta": "3"}, {"ingrediente": "Farina", "qta": "per infarinare"}, {"ingrediente": "Cipolla", "qta": "1"}, {"ingrediente": "Vino bianco", "qta": "mezzo bicchiere"}, {"ingrediente": "Brodo di carne", "qta": "circa 500 ml"}, {"ingrediente": "Prezzemolo, aglio, scorza di limone (gremolada)", "qta": "q.b."}, {"ingrediente": "Riso Carnaroli", "qta": "240 g"}, {"ingrediente": "Zafferano", "qta": "1 bustina"}, {"ingrediente": "Burro", "qta": "50 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "50 g"}, {"ingrediente": "Brodo vegetale (per il risotto)", "qta": "circa 700 ml"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Incidi la pellicina degli ossibuchi, infarinali e rosolali in olio da entrambi i lati.", "Togli la carne, rosola la cipolla tritata nello stesso tegame.", "Rimetti gli ossibuchi, sfuma con il vino.", "Copri con il brodo caldo, incoperchia e cuoci a fuoco basso 50-60 minuti, aggiungendo brodo se serve.", "Prepara la gremolada tritando prezzemolo, aglio e scorza di limone.", "Per il risotto: tosta il riso, sfuma con vino se vuoi, aggiungi il brodo un mestolo alla volta per 16-18 minuti.", "Sciogli lo zafferano in un po' di brodo caldo e uniscilo a metà cottura.", "Manteca con burro e parmigiano.", "Servi il risotto con l'ossobuco sopra, completando con la gremolada."], "avanzi": "L'ossobuco è ottimo anche il giorno dopo; il risotto va preparato fresco.", "freezer": "L'ossobuco si può congelare; il risotto no.", "ricordare": "", "link": "https://www.cortilia.it/ricette/autunno/ossobuco-e-risotto-alla-milanese"}, "Polpettone al sugo": {"porzioni": "4 porzioni", "tempo": "1 ora e 10 minuti", "ingredienti": [{"ingrediente": "Carne macinata mista", "qta": "600 g"}, {"ingrediente": "Uova", "qta": "2"}, {"ingrediente": "Parmigiano grattugiato", "qta": "50 g"}, {"ingrediente": "Pangrattato", "qta": "50 g"}, {"ingrediente": "Mozzarella o provola (facoltativa)", "qta": "100 g"}, {"ingrediente": "Passata di pomodoro", "qta": "500 g"}, {"ingrediente": "Cipolla", "qta": "1/2"}, {"ingrediente": "Basilico fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["In una ciotola unisci carne, uova, parmigiano, pangrattato, sale e pepe.", "Amalgama bene e forma un rettangolo su carta forno.", "Se vuoi il cuore filante, distribuisci la mozzarella al centro e arrotola stringendo con la carta forno.", "Prepara il sugo: soffriggi la cipolla in olio con basilico, aggiungi la passata e sala.", "Adagia delicatamente il polpettone nel sugo bollente, ricoprendolo di sugo anche sopra.", "Copri e cuoci a fuoco medio-basso 40 minuti, girandolo delicatamente a metà cottura.", "Lascia riposare 10 minuti prima di tagliare e servire con il sugo."], "avanzi": "Ottimo anche il giorno dopo.", "freezer": "Si può congelare già cotto.", "ricordare": "", "link": "https://www.tavolartegusto.it/ricetta/polpettone-al-sugo-ricetta/"}, "Hamburger fatti in casa": {"porzioni": "3 porzioni", "tempo": "20–25 minuti", "ingredienti": [{"ingrediente": "Carne macinata di manzo (20% grasso)", "qta": "450 g"}, {"ingrediente": "Sale", "qta": "q.b."}, {"ingrediente": "Pepe", "qta": "q.b."}, {"ingrediente": "Prezzemolo (facoltativo)", "qta": "q.b."}, {"ingrediente": "Panini per hamburger", "qta": "3"}, {"ingrediente": "Formaggio, insalata, pomodoro (a piacere)", "qta": "q.b."}], "procedimento": ["Lascia la carne a temperatura ambiente 20-30 minuti prima di lavorarla.", "Condisci con sale, pepe e prezzemolo se lo usi, senza impastare troppo per non renderla dura.", "Forma 3 dischi di circa 150 g ciascuno, non troppo compattati.", "Scalda bene una padella o piastra.", "Cuoci gli hamburger 3-4 minuti per lato, girandoli una sola volta.", "Se usi il formaggio, aggiungilo un minuto prima di fine cottura e copri con un coperchio per farlo sciogliere.", "Componi il panino con gli ingredienti scelti."], "avanzi": "Meglio fresco appena cotto.", "freezer": "Si possono congelare crudi.", "ricordare": "", "link": "https://www.tavolartegusto.it/ricetta/hamburger-ricetta/"}, "Spezzatino di manzo con patate": {"porzioni": "3 porzioni", "tempo": "1 ora e 40 minuti", "ingredienti": [{"ingrediente": "Polpa di manzo per spezzatino", "qta": "500 g"}, {"ingrediente": "Patate", "qta": "500 g"}, {"ingrediente": "Carota, sedano, cipolla", "qta": "1 pezzo ciascuno"}, {"ingrediente": "Passata di pomodoro", "qta": "200 g"}, {"ingrediente": "Vino rosso", "qta": "mezzo bicchiere"}, {"ingrediente": "Farina", "qta": "per infarinare"}, {"ingrediente": "Brodo o acqua", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Taglia la carne a cubotti, infarinala leggermente.", "Trita carota, sedano e cipolla, falli soffriggere in olio.", "Aggiungi la carne e rosolala a fuoco vivace finché dorata.", "Sfuma con il vino, lascia evaporare.", "Unisci la passata, sala e pepa, copri con acqua o brodo.", "Cuoci coperto a fuoco basso circa 1 ora, mescolando ogni tanto.", "Sbuccia le patate, tagliale a tocchetti e aggiungile.", "Continua la cottura altri 25-30 minuti, finché carne e patate sono morbide."], "avanzi": "Ottimo anche il giorno dopo.", "freezer": "Si può congelare.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/spezzatino-con-patate/"}, "Pizza fatta in casa": {"porzioni": "3 pizze", "tempo": "40 minuti + 5-6 ore di lievitazione", "ingredienti": [{"ingrediente": "Farina 00 (o mix con Manitoba)", "qta": "500 g"}, {"ingrediente": "Acqua tiepida", "qta": "320 ml"}, {"ingrediente": "Lievito di birra fresco", "qta": "4 g (o 1,5 g secco)"}, {"ingrediente": "Sale", "qta": "12 g"}, {"ingrediente": "Olio EVO", "qta": "2 cucchiai"}, {"ingrediente": "Passata di pomodoro", "qta": "400 g"}, {"ingrediente": "Mozzarella", "qta": "300 g"}, {"ingrediente": "Basilico e origano", "qta": "q.b."}], "procedimento": ["Sciogli il lievito in poca acqua tiepida.", "Nella ciotola dell'impastatrice (o a mano) unisci farina, acqua con il lievito e inizia a impastare.", "Aggiungi il sale a metà impasto, mai a contatto diretto col lievito.", "Verso la fine incorpora l'olio a filo.", "Impasta finché liscio ed elastico, forma una palla e lascia lievitare coperta 1-2 ore a temperatura ambiente.", "Dividi in 3 palline, lascia lievitare ancora 3-4 ore (o in frigo tutta la notte).", "Stendi ogni pallina, condisci con passata, mozzarella e origano.", "Cuoci in forno il più caldo possibile (idealmente 250°C) per 8-10 minuti, sul ripiano più basso."], "avanzi": "Buona anche il giorno dopo, si riscalda bene in padella o forno.", "freezer": "L'impasto crudo si può congelare a palline.", "ricordare": "L'impasto ha bisogno di diverse ore di lievitazione: va preparato in anticipo.", "link": "https://www.cookaround.com/ricetta/Impasto-per-la-pizza.html"}, "Parmigiana di zucchine": {"porzioni": "4 porzioni", "tempo": "1 ora", "ingredienti": [{"ingrediente": "Zucchine", "qta": "1 kg"}, {"ingrediente": "Passata di pomodoro", "qta": "400 g"}, {"ingrediente": "Mozzarella", "qta": "250 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "60 g"}, {"ingrediente": "Aglio", "qta": "1 spicchio"}, {"ingrediente": "Basilico fresco", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale", "qta": "q.b."}], "procedimento": ["Taglia le zucchine a fette sottili nel senso della lunghezza.", "Grigliale su una piastra calda 2 minuti per lato (oppure cuocile in forno a 200°C per 15 minuti).", "Prepara il sugo: soffriggi l'aglio in olio, aggiungi la passata, sala e cuoci 15 minuti con basilico.", "Scola bene la mozzarella e tagliala a dadini.", "In Acqua (per la salamoia)", "qta": "50 ml"}, {"ingrediente": "Sale grosso", "qta": "q.b."}], "procedimento": ["Sciogli il lievito in un po' di acqua tiepida con lo zucchero o il miele.", "Unisci la farina, l'acqua col lievito e il resto dell'acqua, inizia a impastare.", "Aggiungi l'olio a filo, poi il sale, continuando a impastare finché l'impasto è liscio ed elastico.", "Forma una palla, copri e lascia lievitare 1-2 ore a temperatura ambiente, fino al raddoppio.", "Ungi una teglia con olio, trasferisci l'impasto e stendilo delicatamente con le mani senza sgonfiarlo.", "Lascia lievitare ancora circa 1 ora coperta.", "Con le dita unte d'olio, crea i classici buchi profondi sulla superficie.", "Emulsiona olio, acqua e sale grosso per la salamoia e versala sulla focaccia.", "Cuoci in forno già caldo a 220°C per 20-25 minuti, finché dorata."], "avanzi": "Buona anche il giorno dopo, si riscalda bene in forno.", "freezer": "Si può congelare già cotta, a tranci.", "ricordare": "L'impasto va preparato con 3-4 ore di anticipo per la lievitazione.", "link": "https://www.accademianazionalepizzadoc.it/focaccia-genovese-ricetta-fugassa-ligure-originale/"}, "Gricia": {"porzioni": "3 porzioni", "tempo": "15–20 minuti", "ingredienti": [{"ingrediente": "Rigatoni o spaghetti", "qta": "240 g"}, {"ingrediente": "Guanciale", "qta": "150 g"}, {"ingrediente": "Pecorino romano grattugiato", "qta": "100 g"}, {"ingrediente": "Pepe nero", "qta": "q.b."}], "procedimento": ["Taglia il guanciale a listarelle spesse mezzo centimetro.", "Mettilo in padella fredda senza aggiungere grassi e falla rosolare a fuoco medio finché croccante.", "Metti a bollire l'acqua per la pasta, sala solo a bollore.", "Cuoci la pasta, tenendo da parte un mestolo di acqua di cottura.", "In una ciotola prepara una crema con pecorino, pepe e un po' di acqua di cottura, senza grumi.", "Scola la pasta e uniscila al guanciale nella padella.", "Togli dal fuoco e manteca con la crema di pecorino, aggiungendo acqua di cottura se iano grattugiato", "qta": "50 g"}, {"ingrediente": "Noce moscata", "qta": "q.b."}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Taglia la zucca a cubetti.", "Trita la cipolla e falla appassire in olio.", "Aggiungi la zucca e falla cuocere qualche minuto, poi bagna con un mestolo di brodo caldo e cuoci finché morbida.", "Frulla circa metà della zucca cotta con un po' di brodo per ottenere una crema.", "Nella stessa pentola tosta il riso 1-2 minuti, sfuma con il vino se lo usi.", "Aggiungi il brodo un mestolo alla volta, mescolando, per 16-18 minuti.", "A metà cottura unisci la crema di zucca e i pezzetti tenuti da parte.", "A fuoco spento manteca con burro, parmigiano e noce moscata."], "avanzi": "Meglio fresco.", "freezer": "Non adatto.", "ricordare": "", "link": "https://www.cucchiaio.it/ricetta/risotto-alla-zucca/"}, "Risotto agli asparagi": {"porzioni": "3 porzioni", "tempo": "35 minuti", "ingredienti": [{"ingrediente": "Riso Carnaroli", "qta": "240 g"}, {"ingrediente": "Asparagi", "qta": "1 mazzo"}, {"ingrediente": "Cipolla", "qta": "1/2"}, {"ingrediente": "Brodo vegetale", "qta": "circa 700 ml"}, {"ingrediente": "Vino bianco", "qta": "facoltativo, mezzo bicchiere"}, {"ingrediente": "Burro", "qta": "20 g"}, {"ingrediente": "Parmigiano grattugiato", "qta": "50 g"}, {"ingrediente": "Olio EVO", "qta": "q.b."}, {"ingrediente": "Sale e pepe", "qta": "q.b."}], "procedimento": ["Elimina la parte dura del gambo degli asparagi (tienila da parte per il brodo) e taglia il resto a rondelle, tenendo le punte intere.", "Trita la cipolla e falla appassire in olio.", "Aggiungi gli asparagi a rondelle e fai insaporire qualche minuto.", "Unisci il riso e tostalo 1-2 minuti, sfuma con il vino se lo usi.", "Aggiungi il brodo un mestolo alla volta, mescolando, per 16-18 minuti.", "A metà cottura unisci le punte degli asparagi.", "A fuoco spento manteca con burro e parmigiano."], "avanzi": "Meglio fresco.", "freezer": "
