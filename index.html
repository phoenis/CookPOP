<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CookPOP">
<meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18191b" media="(prefers-color-scheme: dark)">
<title>CookPOP</title>
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login-gate">
  <div class="login-box">
    <h2>CookPOP</h2>
    <p class="login-sub">Accedi per continuare</p>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username">
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-submit" type="button">Accedi</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>
<header class="topbar">
  <div class="topbar-inner">
    <span class="topbar-title">CookPOP</span>
    <button class="settings-btn" id="settings-btn" type="button" aria-label="Impostazioni">⚙️</button>
  </div>
</header>
<div class="app">
  <main class="panel" id="panel"></main>
</div>
<nav class="tabs">
  <button data-tab="menu" class="active"><span class="bn-icon"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true" role="img" class="iconify iconify--ph" width="1em" height="1em" preserveAspectRatio="xMidYMid meet" viewBox="0 0 256 256"><g fill="currentColor"><path d="M216 48v40H40V48a8 8 0 0 1 8-8h160a8 8 0 0 1 8 8" opacity=".2"></path><path d="M208 32h-24v-8a8 8 0 0 0-16 0v8H88v-8a8 8 0 0 0-16 0v8H48a16 16 0 0 0-16 16v160a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V48a16 16 0 0 0-16-16M72 48v8a8 8 0 0 0 16 0v-8h80v8a8 8 0 0 0 16 0v-8h24v32H48V48Zm136 160H48V96h160zm-96-88v64a8 8 0 0 1-16 0v-51.06l-4.42 2.22a8 8 0 0 1-7.16-14.32l16-8A8 8 0 0 1 112 120m59.16 30.45L152 176h16a8 8 0 0 1 0 16h-32a8 8 0 0 1-6.4-12.8l28.78-38.37a8 8 0 1 0-13.31-8.83a8 8 0 1 1-13.85-8A24 24 0 0 1 176 136a23.76 23.76 0 0 1-4.84 14.45"></path></g></svg></span><span class="bn-label">Menù</span></button>
  <button data-tab="spesa"><span class="bn-icon">🛒</span><span class="bn-label">Spesa</span></button>
  <button data-tab="prep"><span class="bn-icon">📖</span><span class="bn-label">Prep</span></button>
  <button data-tab="dispensa"><span class="bn-icon">🗄️</span><span class="bn-label">Dispensa</span></button>
</nav>
<div class="settings-backdrop" id="settings-backdrop">
  <div class="settings-sheet filters-modal">
    <div class="filters-modal-header">
      <h3>Impostazioni</h3>
      <button class="filters-close-btn" id="settings-close">✕</button>
    </div>
    <div class="filter-group-label">Chi sei (solo su questo telefono)</div>
    <div class="view-toggle" id="current-user-toggle">
      <button type="button" class="view-btn" data-set-user="mara">Mara</button>
      <button type="button" class="view-btn" data-set-user="ste">Ste</button>
    </div>
    <button class="settings-item" id="refresh-btn" type="button" title="Ricarica la pagina scaricando l'ultima versione, ignorando la cache del browser">↻ Aggiorna app</button>
    <button class="settings-item settings-item-danger" id="logout-btn" type="button" style="display:none;">⏻ Esci</button>
    <p class="settings-credit">AGGIORNATO A MANO, CUCINATO CON CURA</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
