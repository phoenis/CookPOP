<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CookPOP">
<meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18191b" media="(prefers-color-scheme: dark)">
<title>CookPOP</title>
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login-gate">
  <div class="login-box">
    <h2>CookPOP</h2>
    <p class="login-sub">Accedi per continuare</p>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username">
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password">
    <button id="login-submit" type="button" class="btn is-solid is-block">Accedi</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>
<header class="topbar">
  <div class="topbar-inner">
    <span class="topbar-title">CookPOP</span>
    <button class="btn is-icon settings-btn" id="settings-btn" type="button" aria-label="Impostazioni">⚙️</button>
  </div>
</header>
<div class="app">
  <main class="panel" id="panel"></main>
</div>
<nav class="tabs">
  <button data-tab="menu" class="active"><span class="bn-icon">📅</span><span class="bn-label">Menù</span></button>
  <button data-tab="spesa"><span class="bn-icon">🛒</span><span class="bn-label">Spesa</span></button>
  <button data-tab="prep"><span class="bn-icon">📖</span><span class="bn-label">Prep</span></button>
  <button data-tab="dispensa"><span class="bn-icon">🗄️</span><span class="bn-label">Dispensa</span></button>
</nav>
<div class="settings-backdrop" id="settings-backdrop">
  <div class="settings-sheet filters-modal">
    <div class="filters-modal-header">
      <h3>Impostazioni</h3>
      <button class="btn is-icon filters-close-btn" id="settings-close">✕</button>
    </div>
    <div class="filter-group-label">Chi sei (solo su questo telefono)</div>
    <div class="view-toggle" id="current-user-toggle">
      <button type="button" class="btn is-outline view-btn" data-set-user="mara">Mara</button>
      <button type="button" class="btn is-outline view-btn" data-set-user="ste">Ste</button>
    </div>
    <button class="btn is-outline settings-item" id="refresh-btn" type="button" title="Ricarica la pagina scaricando l'ultima versione, ignorando la cache del browser">↻ Aggiorna app</button>
    <button class="btn is-outline settings-item settings-item-danger" id="logout-btn" type="button" style="display:none;">⏻ Esci</button>
    <p class="settings-credit">AGGIORNATO A MANO, CUCINATO CON CURA</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
