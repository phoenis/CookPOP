<script>
// Applica tema e colore d'accento (preferenze di QUESTO dispositivo, salvate
// in localStorage — non sincronizzate via Firebase) prima del primo paint,
// per evitare un lampo con i colori sbagliati. Duplica un po' di logica di
// applyTheme/applyAccent in app.js (che gira più tardi, a script caricato,
// e tiene i due allineati quando l'utente cambia scelta dalle Impostazioni)
// perché deve poter girare qui, sincrona, senza aspettare nulla.
(function(){
  try{
    var theme = localStorage.getItem('cookpop-theme');
    if(theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    var accent = localStorage.getItem('cookpop-accent');
    if(accent){
      document.documentElement.style.setProperty('--gold', accent);
      var m = accent.replace('#','');
      var r = parseInt(m.substring(0,2),16), g = parseInt(m.substring(2,4),16), b = parseInt(m.substring(4,6),16);
      var d = function(c){ return Math.max(0, Math.round(c*0.82)).toString(16).padStart(2,'0'); };
      document.documentElement.style.setProperty('--gold-dark', '#'+d(r)+d(g)+d(b));
      document.documentElement.style.setProperty('--gold-rgb', r+','+g+','+b);
    }
    var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('meta-theme-color').setAttribute('content', dark ? '#121212' : '#f3f2f2');
  }catch(e){}
})();
</script>
